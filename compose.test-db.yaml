services:
  postgres-test:
    image: pgvector/pgvector:0.8.6-pg18
    restart: unless-stopped

    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom_control

    ports:
      - "127.0.0.1:15432:5432"

    volumes:
      - loom_test_postgres:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom_control"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  loom_test_postgres:
