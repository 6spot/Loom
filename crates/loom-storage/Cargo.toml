[package]
name = "loom-storage"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1"
loom-core = { path = "../loom-core" }
loom-runtime = { path = "../loom-runtime" }
object_store = { version = "0.14", default-features = true }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls", "uuid"] }

[dev-dependencies]
loom-api = { path = "../loom-api" }
loom-capability = { path = "../loom-capability" }
loom-protocol = { path = "../loom-protocol" }
semver = "1"
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread"] }
url = "2"

[lints]
workspace = true
