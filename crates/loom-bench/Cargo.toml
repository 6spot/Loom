[package]
name = "loom-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loom-agency = { path = "../loom-agency", version = "0.1.0" }
loom-api = { path = "../loom-api", version = "0.1.0" }
loom-capability = { path = "../loom-capability", version = "0.1.0" }
loom-core = { path = "../loom-core", version = "0.1.0" }
loom-protocol = { path = "../loom-protocol", version = "0.1.0" }
loom-runtime = { path = "../loom-runtime", version = "0.1.0" }
loom-storage = { path = "../loom-storage", version = "0.1.0" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "~1.51", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }

[[bin]]
name = "loom-bench"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
unused = "allow"
warnings = "allow"

[lints.clippy]
all = "allow"
pedantic = "allow"
nursery = "allow"
cargo = "allow"
