[package]
name = "loom-client"
version.workspace = true
edition.workspace = true

[dependencies]
futures-util = "0.3"
loom-api = { path = "../loom-api" }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "~1.51", features = ["net", "rt", "time"] }
url = "2"

[lints]
workspace = true

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
futures-util = "0.3"
loom-boundary = { path = "../loom-boundary" }
tokio = { version = "~1.51", features = ["macros", "net", "rt-multi-thread", "time"] }
