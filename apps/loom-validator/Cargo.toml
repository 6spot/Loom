[package]
name = "loom-validator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
loom-api = { path = "../../crates/loom-api", version = "0.1.0" }
loom-client = { path = "../../crates/loom-client", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "~1.51", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
loom-boundary = { path = "../../crates/loom-boundary", version = "0.1.0" }
loom-neutral = { path = "../../capabilities/loom-neutral", version = "0.1.0" }
loom-runtime = { path = "../../crates/loom-runtime", version = "0.1.0" }
loom-storage = { path = "../../crates/loom-storage", version = "0.1.0" }

[lints]
workspace = true
