[package]
name = "loom-validator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
loom-api = { path = "../../crates/loom-api", version = "0.1.0" }
loom-client = { path = "../../crates/loom-client", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
loom-boundary = { path = "../../crates/loom-boundary", version = "0.1.0" }
loom-capability = { path = "../../crates/loom-capability", version = "0.1.0" }
loom-neutral = { path = "../../capabilities/loom-neutral", version = "0.1.0" }
loom-runtime = { path = "../../crates/loom-runtime", version = "0.1.0" }
loom-storage = { path = "../../crates/loom-storage", version = "0.1.0" }

[lints]
workspace = true
