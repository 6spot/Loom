[package]
name = "loom-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.3"
loom-neutral = { path = "../../capabilities/loom-neutral", version = "0.1.0" }
loom-api = { path = "../../crates/loom-api", version = "0.1.0" }
loom-boundary = { path = "../../crates/loom-boundary", version = "0.1.0" }
loom-runtime = { path = "../../crates/loom-runtime", version = "0.1.0" }
loom-storage = { path = "../../crates/loom-storage", version = "0.1.0" }
tokio = { version = "~1.51", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json"] }

[dev-dependencies]
futures-util = "0.3"
loom-capability = { path = "../../crates/loom-capability", version = "0.1.0" }
loom-core = { path = "../../crates/loom-core", version = "0.1.0" }
loom-client = { path = "../../crates/loom-client", version = "0.1.0" }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "~1.51", features = ["macros", "rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
