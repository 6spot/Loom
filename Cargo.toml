[workspace]
resolver = "3"
members = [
    "crates/loom-core",
    "crates/loom-protocol",
    "crates/loom-api",
    "crates/loom-capability",
    "crates/loom-agency",
    "crates/loom-runtime",
    "crates/loom-storage",
    "crates/loom-boundary",
    "crates/loom-client",
    "capabilities/loom-neutral",
    "apps/loom-server",
    "apps/loom-validator",
    "tests/loom-composition",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
