name: loom-chronicle

x-chronicle-image: &chronicle-image
  image: loom-chronicle:${CHRONICLE_IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: apps/chronicle/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: ${CHRONICLE_POSTGRES_USER:-chronicle}
      POSTGRES_PASSWORD: ${CHRONICLE_POSTGRES_PASSWORD:?set CHRONICLE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CHRONICLE_POSTGRES_DB:-chronicle}
    volumes:
      - type: bind
        source: ${CHRONICLE_DATA_DIR:-./chronicle}/postgres
        target: /var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # Prepare the application-owned source bind mount for the non-root
  # Chronicle runtime user (UID/GID 10001). Fresh Debian/CI bind paths are
  # root-owned; this one-shot init is the only root process touching the
  # source volume while long-lived Chronicle services stay non-root.
  chronicle-source-init:
    <<: *chronicle-image
    user: "0:0"
    environment:
      CHRONICLE_SOURCE_DIR: ${CHRONICLE_SOURCE_DIR:-/var/lib/chronicle/sources}
    volumes:
      - type: bind
        source: ${CHRONICLE_DATA_DIR:-./chronicle}/sources
        target: ${CHRONICLE_SOURCE_DIR:-/var/lib/chronicle/sources}
    command:
      - sh
      - -ec
      - |
        mkdir -p "$$CHRONICLE_SOURCE_DIR"
        chown -R 10001:10001 "$$CHRONICLE_SOURCE_DIR"
    restart: "no"

  # Canonical migration runner (C2-R1-T16). The default stack starts from an
  # empty data directory: init applies only Chronicle schema migrations and
  # imports no sample artifacts. Re-running (restart/redeploy) repeats the
  # idempotent migration and never re-seeds data. Explicit C0 fixture
  # regression lives in the isolated PostgreSQL test suite
  # (apps/chronicle/persistence/test_real_dataset_postgres.py), never here.
  chronicle-init:
    <<: *chronicle-image
    environment:
      CHRONICLE_DATABASE_URL: postgresql://${CHRONICLE_POSTGRES_USER:-chronicle}:${CHRONICLE_POSTGRES_PASSWORD:?set CHRONICLE_POSTGRES_PASSWORD}@postgres:5432/${CHRONICLE_POSTGRES_DB:-chronicle}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python3
      - apps/chronicle/persistence/chronicle_persist.py
      - --migrate-only
      - --report
      - /tmp/chronicle-migration-report.json
    restart: "no"

  chronicle-web:
    <<: *chronicle-image
    environment:
      CHRONICLE_BIND: 0.0.0.0
      CHRONICLE_PORT: "8080"
      CHRONICLE_UPSTREAM_URL: http://chronicle-read:8081
      CHRONICLE_ADMIN_USER: ${CHRONICLE_ADMIN_USER:-}
      CHRONICLE_ADMIN_PASSWORD: ${CHRONICLE_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      chronicle-init:
        condition: service_completed_successfully
      chronicle-read:
        condition: service_healthy
    command:
      - chronicle-server
    ports:
      - "${CHRONICLE_BIND_IP:-127.0.0.1}:${CHRONICLE_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # C0 Python read model: the single historical read authority during the C1
  # migration. Internal to the Compose network; the Rust chronicle-web fronts
  # it as CHRONICLE_UPSTREAM_URL. Never publish this port to the host.
  # C1-T3: the same sidecar also serves the internal Studio document
  # upload/revision endpoints (auth is enforced by chronicle-web); its
  # CHRONICLE_SOURCE_DIR persists uploaded sources on the supported data
  # volume so content survives restart/redeploy.
  chronicle-read:
    <<: *chronicle-image
    environment:
      CHRONICLE_DATABASE_URL: postgresql://${CHRONICLE_POSTGRES_USER:-chronicle}:${CHRONICLE_POSTGRES_PASSWORD:?set CHRONICLE_POSTGRES_PASSWORD}@postgres:5432/${CHRONICLE_POSTGRES_DB:-chronicle}
      CHRONICLE_SOURCE_DIR: ${CHRONICLE_SOURCE_DIR:-/var/lib/chronicle/sources}
      CHRONICLE_MAX_UPLOAD_BYTES: ${CHRONICLE_MAX_UPLOAD_BYTES:-10485760}
    volumes:
      - type: bind
        source: ${CHRONICLE_DATA_DIR:-./chronicle}/sources
        target: ${CHRONICLE_SOURCE_DIR:-/var/lib/chronicle/sources}
    depends_on:
      postgres:
        condition: service_healthy
      chronicle-init:
        condition: service_completed_successfully
      chronicle-source-init:
        condition: service_completed_successfully
    command:
      - python3
      - apps/chronicle/read_api/server.py
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    expose:
      - "8081"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # C1-T4 durable ingestion worker: standalone Python process claiming jobs
  # from Chronicle PostgreSQL (FOR UPDATE SKIP LOCKED, expiring leases).
  # No external queue service. Opt-in via the `worker` profile so the
  # default stack stays read + upload shaped; start explicitly with
  # `docker compose -f compose.chronicle.yaml --profile worker up -d
  # chronicle-worker`. Scales by repeating with distinct
  # CHRONICLE_WORKER_ID values (each container should set its own id).
  chronicle-worker:
    <<: *chronicle-image
    profiles:
      - worker
    environment:
      CHRONICLE_DATABASE_URL: postgresql://${CHRONICLE_POSTGRES_USER:-chronicle}:${CHRONICLE_POSTGRES_PASSWORD:?set CHRONICLE_POSTGRES_PASSWORD}@postgres:5432/${CHRONICLE_POSTGRES_DB:-chronicle}
      # C1-T5: the worker segments real stored revision bytes (same
      # Chronicle-owned source volume the upload sidecar writes). Without
      # this mount every stage runs the deterministic fake executor.
      CHRONICLE_SOURCE_DIR: ${CHRONICLE_SOURCE_DIR:-/var/lib/chronicle/sources}
      # C1-T13/T17: real extraction / Reader Presentation are independently
      # enabled only when their model names are set. The endpoint may be
      # OpenAI Responses or a compatible Luna/local gateway.
      CHRONICLE_MODEL_ENDPOINT: ${CHRONICLE_MODEL_ENDPOINT:-}
      CHRONICLE_MODEL_API_KEY: ${CHRONICLE_MODEL_API_KEY:-}
      CHRONICLE_MODEL_TIMEOUT_SECONDS: ${CHRONICLE_MODEL_TIMEOUT_SECONDS:-600}
      # One production input-envelope authority. The worker measures the
      # current prompt template at startup and derives ContextState/chunk
      # headroom from this same value; extraction applies the final hard gate.
      CHRONICLE_MODEL_INPUT_BUDGET_CHARS: ${CHRONICLE_MODEL_INPUT_BUDGET_CHARS:-16384}
      CHRONICLE_EXTRACTION_MODEL: ${CHRONICLE_EXTRACTION_MODEL:-}
      CHRONICLE_PRESENTATION_MODEL: ${CHRONICLE_PRESENTATION_MODEL:-}
      # C2-R1: formal joint chapter model entry consumed by
      # chapter_stage.chapter_model_from_env. Without this passthrough
      # the worker container never sees CHRONICLE_CHAPTER_MODEL, so the
      # joint chapter pipeline stays disabled/fails closed even when the
      # host .env.chronicle sets it.
      CHRONICLE_CHAPTER_MODEL: ${CHRONICLE_CHAPTER_MODEL:-}
      # C2-R1-T16: chapter-production §3 engineering envelope. These bounds
      # enter the chapter request fingerprint (ChapterLimits.from_env); they
      # are resource-protection limits, not a claim that the configured
      # provider supports the full 64k output scale. Empty values fall back
      # to the contract defaults documented in .env.chronicle.example.
      CHRONICLE_CHAPTER_MAX_SOURCE_CHARS: ${CHRONICLE_CHAPTER_MAX_SOURCE_CHARS:-}
      CHRONICLE_CHAPTER_MAX_PROMPT_CHARS: ${CHRONICLE_CHAPTER_MAX_PROMPT_CHARS:-}
      CHRONICLE_CHAPTER_MAX_RESPONSE_CHARS: ${CHRONICLE_CHAPTER_MAX_RESPONSE_CHARS:-}
      CHRONICLE_CHAPTER_MAX_RESPONSE_BYTES: ${CHRONICLE_CHAPTER_MAX_RESPONSE_BYTES:-}
      CHRONICLE_CHAPTER_MAX_OUTPUT_TOKENS: ${CHRONICLE_CHAPTER_MAX_OUTPUT_TOKENS:-}
    volumes:
      - type: bind
        source: ${CHRONICLE_DATA_DIR:-./chronicle}/sources
        target: ${CHRONICLE_SOURCE_DIR:-/var/lib/chronicle/sources}
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
      chronicle-init:
        condition: service_completed_successfully
      chronicle-source-init:
        condition: service_completed_successfully
    command:
      - python3
      - apps/chronicle/worker/production_worker.py
      - --worker-id
      - ${CHRONICLE_WORKER_ID:-chronicle-worker-01}
      - --lease-seconds
      - ${CHRONICLE_WORKER_LEASE_SECONDS:-300}
    restart: unless-stopped