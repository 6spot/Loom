name: Chronicle

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Resolve Chronicle CI plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify affected contracts
        id: classify
        env:
          CI_PLAN: ${{ inputs.plan || '' }}
        run: python3 tools/ci_routing.py classify --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  chapter-pipeline:
    name: Chapter production and Studio task contracts
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['chapter-pipeline']
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@127.0.0.1:15432/loom_control

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python3 -m pip install -r apps/chronicle/persistence/requirements.txt -r apps/chronicle/read_api/requirements.txt -r apps/chronicle/worker/requirements.txt
      - name: Verify owned contracts
        run: |
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_chapter_production_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_staged_chapter_contract_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_identity_candidates_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_catalog_publication_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_resolve_publish_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_*unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_staged_chapter_store_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_staged_chapter_pipeline_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_staged_comparison_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_staged_worker_lifecycle_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_production_source_fail_closed_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/read_api -p 'test_chapter_content_review_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/read_api -p 'test_studio_jobs_postgres.py' -v

  reading-contracts:
    name: Narrative, publication and search contracts
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['reading-contracts']
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@127.0.0.1:15432/loom_control

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python3 -m pip install -r apps/chronicle/persistence/requirements.txt -r apps/chronicle/read_api/requirements.txt -r apps/chronicle/worker/requirements.txt
      - name: Verify owned contracts
        run: |
          python3 -m unittest discover -s apps/chronicle/corpus -p 'test_corroboration_cases.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_narrative_contract.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_narrative*_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_reader_language_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/read_api -p 'test_search*.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_narrative_pipeline_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_reading_pipeline_postgres.py' -v -k publish_faults

  person-contracts:
    name: Person-state corpus and production contracts
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['person-contracts']
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@127.0.0.1:15432/loom_control

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python3 -m pip install -r apps/chronicle/persistence/requirements.txt -r apps/chronicle/read_api/requirements.txt -r apps/chronicle/worker/requirements.txt
      - name: Verify owned contracts
        run: |
          python3 -m unittest discover -s apps/chronicle/corpus -p 'test_third_round_cases.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_person_history_contract_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_person_state_contract_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_person_history_pipeline_postgres.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p 'test_person_state_pipeline_postgres.py' -v

  web-components:
    name: Selected frontend components
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['web-components']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json
      - name: Install webapp and Chromium
        run: |
          npm --prefix apps/chronicle/webapp ci
          npx --prefix apps/chronicle/webapp playwright install --with-deps chromium
      - name: Frontend unit tests
        run: npm --prefix apps/chronicle/webapp test
      - name: Verify selected browser components
        env:
          CHRONICLE_READING_SUITE: ${{ fromJSON(needs.changes.outputs.plan).suites.reading }}
          CHRONICLE_HISTORY_SUITE: ${{ fromJSON(needs.changes.outputs.plan).suites.history }}
          CHRONICLE_NARRATIVE_SUITE: ${{ fromJSON(needs.changes.outputs.plan).suites.narrative }}
          CHRONICLE_PERSON_SUITE: ${{ fromJSON(needs.changes.outputs.plan).suites.person }}
          CHRONICLE_STUDIO_SUITE: ${{ fromJSON(needs.changes.outputs.plan).suites.studio }}
        run: |
          set -euo pipefail
          npm --prefix apps/chronicle/webapp run dev -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/chronicle-component-vite.log 2>&1 &
          chronicle_vite_pid=$!
          trap 'kill "$chronicle_vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5174/ > /dev/null; then break; fi
            sleep 1
          done
          if [[ "$CHRONICLE_READING_SUITE" == "true" ]]; then
            node apps/chronicle/webapp/scripts/reading-component-smoke.mjs --base-url http://127.0.0.1:5174 --suite all --output /tmp/chronicle-reading-components
          fi
          if [[ "$CHRONICLE_HISTORY_SUITE" == "true" ]]; then
            node apps/chronicle/webapp/scripts/history-component-smoke.mjs --base-url http://127.0.0.1:5174
          fi
          if [[ "$CHRONICLE_NARRATIVE_SUITE" == "true" ]]; then
            node apps/chronicle/webapp/scripts/narrative-review-component-smoke.mjs --base-url http://127.0.0.1:5174
          fi
          if [[ "$CHRONICLE_PERSON_SUITE" == "true" ]]; then
            node apps/chronicle/webapp/scripts/reading-component-smoke.mjs --base-url http://127.0.0.1:5174 --suite r3-all --output /tmp/chronicle-r3-components
          fi
          if [[ "$CHRONICLE_STUDIO_SUITE" == "true" ]]; then
            node apps/chronicle/webapp/scripts/studio-workspace-component-smoke.mjs --base-url http://127.0.0.1:5174 --output /tmp/chronicle-studio-components
          fi

  staged-gate:
    name: Staged 0.4 source-to-public acceptance gate (fixture)
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['staged-gate']
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@127.0.0.1:15432/loom_control

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Install gate dependencies
        run: |
          python3 -m pip install \
            -r apps/chronicle/persistence/requirements.txt \
            -r apps/chronicle/read_api/requirements.txt \
            -r apps/chronicle/worker/requirements.txt

      - name: Install webapp and Playwright
        run: |
          npm --prefix apps/chronicle/webapp ci
          npx --prefix apps/chronicle/webapp playwright install --with-deps chromium

      - name: Staged gate unit tests
        run: python3 -m unittest discover -s apps/chronicle/acceptance -p 'test_staged_gate.py' -v

      - name: Validate current browser drivers and suites
        run: |
          set -euo pipefail
          for file in \
            apps/chronicle/webapp/scripts/reading-flow-smoke.mjs \
            apps/chronicle/webapp/scripts/person-state-flow-smoke.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/manifest.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/runner.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/suites/flow.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/suites/accessibility.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/suites/performance.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/person-states/manifest.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/person-states/runner.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/person-states/suites/reading.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/person-states/suites/review.mjs \
            apps/chronicle/webapp/tests/reading-browser/integration/person-states/suites/performance.mjs; do
            node --check "$file"
          done

      - name: Reading locate timing probe regression (Chromium)
        run: node apps/chronicle/webapp/tests/reading-browser/integration/locate-timing-smoke.mjs

      - name: Build Chronicle image
        run: docker build -f apps/chronicle/Dockerfile -t loom-chronicle:local .

      - name: Staged 0.4 real-stack browser gate (fixture mode)
        run: |
          set -euo pipefail
          printf '%s\n' \
            'CHRONICLE_POSTGRES_PASSWORD=ci-staged-gate' \
            'CHRONICLE_ADMIN_USER=admin' \
            'CHRONICLE_ADMIN_PASSWORD=ci-staged-gate' \
            > /tmp/chronicle-staged-test.env
          python3 apps/chronicle/acceptance/staged_gate.py \
            --mode fixture \
            --env-file /tmp/chronicle-staged-test.env \
            --source-pack apps/chronicle/corpus/first-round/source-pack.json \
            --evidence-dir /tmp/chronicle-staged-offline \
            --browser-required
          python3 - <<'PY'
          import json
          m = json.load(open("/tmp/chronicle-staged-offline/manifest.json"))
          c = m["criteria"]
          assert m["result"] == "PASS" and m["mode"] == "fixture" and m["fixture_only"], m
          assert c["staged_0_4_source_to_acceptance"] == "PASS", c
          terminal_jobs = m["terminal_jobs"]
          assert [job["job_id"] for job in terminal_jobs] == [work["job_id"] for work in m["works"]], terminal_jobs
          assert all((job.get("validation") or {}).get("status") == "PASS" for job in terminal_jobs), terminal_jobs
          assert c["scenario_coverage"] == "PASS", c
          assert c["negative_faults"] == "PASS", c
          assert c["scale_contract"] == "PASS", c
          assert c["browser_interaction"] == "PASS", c
          assert c["performance_budget"] == "PASS", c
          assert m["scale"]["unit_count"] >= 5000 and m["scale"]["group_count"] >= 1000, m["scale"]
          assert m["browser"]["ok"] is True, m["browser"]
          kinds = {n["kind"] for n in m["negatives"]}
          assert {"unknown_time", "missing_context", "missing_role"} <= kinds, kinds
          assert m["scale_contract"]["units_checked"] >= 50, m["scale_contract"]
          perf = next(r for r in m["browser"]["results"] if r["suite"] == "performance")
          runs = perf["evidence"]["runs"]
          assert len(runs) == 5, runs
          assert all(r["active_p95_ms"] <= 100 and r["restore_ms"] <= 250 for r in runs), runs
          bm = json.load(open("/tmp/chronicle-staged-offline/reading-fixture-manifest.json"))
          mounted_max = bm["budgets"]["mounted_max_units"]
          for run in runs:
            assert run["window_progression"]["mounted_max"] <= mounted_max, run
            assert run["window_progression"]["duration_seconds"] >= 30, run
            assert run["window_progression"]["active_ordinal_max"] > run["window_progression"]["active_ordinal_min"], run
            assert run["max_long_task_ms"] < bm["budgets"]["max_long_task_ms"], run
            assert run["request_counts"]["preview"] == 0, run
          PY
  chronicle-gate:
    name: Chronicle Gate
    if: always()
    needs: [changes, chapter-pipeline, reading-contracts, person-contracts, web-components, staged-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require every selected check to succeed
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_routing.py gate --group chronicle
