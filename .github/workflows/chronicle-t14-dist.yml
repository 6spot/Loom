name: Chronicle T14 Dist Builder

on:
  push:
    branches:
      - feat/chronicle-c1-t14-coverage
    paths:
      - ".github/workflows/chronicle-t14-dist.yml"

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Build Chronicle web dist
        run: |
          set -euo pipefail
          cd apps/chronicle/webapp
          npm ci
          npm test
          npm run build
          npm run smoke:dist

      - name: Commit generated dist
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apps/chronicle/web/dist
          if git diff --cached --quiet; then
            echo "Chronicle web dist is already synchronized."
            exit 0
          fi
          git commit -m "chore(chronicle): sync C1-T14 web dist"
          git push origin "HEAD:${GITHUB_REF_NAME}"
