name: Chronicle Dist Capture

on:
  pull_request:
    paths:
      - ".github/workflows/chronicle-dist-capture.yml"
      - "apps/chronicle/webapp/**"

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Build Chronicle committed bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Build webapp
        run: |
          set -euo pipefail
          cd apps/chronicle/webapp
          npm ci
          npm test
          npm run build
          npm run smoke:dist

      - name: Commit generated dist to PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chronicle/web/dist
          if git diff --cached --quiet; then
            echo "chronicle web/dist already current"
            exit 0
          fi
          git commit -m "build(chronicle): refresh final T10 web bundle"
          git push origin HEAD:${{ github.head_ref }}
