name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/CODEOWNERS"
      - ".dockerignore"
      - ".env.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "**/*.sql"
      - "capabilities/**"
      - "tests/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "Dockerfile"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/check_architecture.py"
      - "tools/check_storage_sql_ownership.py"
      - "tools/postgres-test.sh"
      - "tools/test.sh"
      - "tools/test_validator_ready.py"
      - "tools/validator_ready.py"
      - "tools/validator-authority-gate.sh"
      - "tools/validator-certification-gate.py"
      - "tools/validator-certification-gate.sh"
      - "tools/validator-pg18-gate.sh"
      - "tools/fixtures/validator-ready/**"
      - "docs/tasks/validator/**"
      - "docs/tasks/validator-recert/**"
      - "docs/tasks/scheduler-discovery/**"
      - "docs/tasks/ci-governance/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/CODEOWNERS"
      - ".dockerignore"
      - ".env.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "**/*.sql"
      - "capabilities/**"
      - "tests/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "Dockerfile"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/check_architecture.py"
      - "tools/check_storage_sql_ownership.py"
      - "tools/postgres-test.sh"
      - "tools/test.sh"
      - "tools/test_validator_ready.py"
      - "tools/validator_ready.py"
      - "tools/validator-authority-gate.sh"
      - "tools/validator-certification-gate.py"
      - "tools/validator-certification-gate.sh"
      - "tools/validator-pg18-gate.sh"
      - "tools/fixtures/validator-ready/**"
      - "docs/tasks/validator/**"
      - "docs/tasks/validator-recert/**"
      - "docs/tasks/scheduler-discovery/**"
      - "docs/tasks/ci-governance/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  CARGO_DENY_VERSION: "0.18.9"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      dependency: ${{ steps.classify.outputs.dependency }}
      ledger: ${{ steps.classify.outputs.ledger }}
      postgres: ${{ steps.classify.outputs.postgres }}
      validator: ${{ steps.classify.outputs.validator }}
      deployment: ${{ steps.classify.outputs.deployment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          rust=false
          dependency=false
          ledger=false
          postgres=false
          validator=false
          deployment=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rust=true
            dependency=true
            ledger=true
            postgres=true
            validator=true
            deployment=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="${head}^"
              fi
            fi

            echo "Classifying changes from $base to $head"
            git diff --name-only "$base" "$head" > /tmp/loom-ci-changed-files
            cat /tmp/loom-ci-changed-files

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue

              # Changing CI authority itself validates every route once.
              case "$path" in
                .github/workflows/ci.yml|.github/CODEOWNERS)
                  rust=true
                  dependency=true
                  ledger=true
                  postgres=true
                  validator=true
                  deployment=true
                  ;;
              esac

              # Dependency policy is only relevant when dependency metadata changes.
              case "$path" in
                Cargo.lock)
                  dependency=true
                  rust=true
                  validator=true
                  ;;
                Cargo.toml|*/Cargo.toml|deny.toml)
                  dependency=true
                  rust=true
                  ;;
              esac

              # Machine-readable task records are governance inputs, not code.
              case "$path" in
                docs/tasks/validator/*|docs/tasks/validator-recert/*|docs/tasks/scheduler-discovery/*|docs/tasks/ci-governance/*|tools/validator_ready.py|tools/test_validator_ready.py|tools/fixtures/validator-ready/*)
                  ledger=true
                  ;;
              esac

              # Storage implementation and SQL changes need the PostgreSQL contract.
              case "$path" in
                crates/loom-storage/*|*.sql)
                  postgres=true
                  ;;
                compose.test-db.yaml|tools/postgres-test.sh)
                  postgres=true
                  validator=true
                  ;;
              esac

              # Validator implementation/certification changes keep the heavy gates local.
              case "$path" in
                apps/loom-validator/*|tools/test.sh|tools/validator-authority-gate.sh|tools/validator-certification-gate.py|tools/validator-certification-gate.sh|tools/validator-pg18-gate.sh)
                  validator=true
                  ;;
              esac

              # Rust source and architecture changes get the ordinary Rust lane.
              case "$path" in
                *.rs|capabilities/*|tests/*|rust-toolchain.toml|rustfmt.toml|tools/check_architecture.py|tools/check_storage_sql_ownership.py)
                  rust=true
                  ;;
              esac

              # Deployment configuration has its own cheap validation lane.
              case "$path" in
                compose.yaml|Dockerfile|.dockerignore|.env.example|docker/*)
                  deployment=true
                  ;;
              esac
            done < /tmp/loom-ci-changed-files
          fi

          {
            echo "rust=$rust"
            echo "dependency=$dependency"
            echo "ledger=$ledger"
            echo "postgres=$postgres"
            echo "validator=$validator"
            echo "deployment=$deployment"
          } >> "$GITHUB_OUTPUT"

          printf 'rust=%s dependency=%s ledger=%s postgres=%s validator=%s deployment=%s\n' \
            "$rust" "$dependency" "$ledger" "$postgres" "$validator" "$deployment"

  ledger:
    name: Task ledger governance
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validator READY fixtures
        run: python3 tools/test_validator_ready.py

      - name: Validator task ledger
        run: python3 tools/validator_ready.py --check

      - name: Validator re-certification ledger
        run: python3 tools/validator_ready.py --root docs/tasks/validator-recert --check --format json

      - name: Validator Stage-1 re-certification ledger
        run: python3 tools/validator_ready.py --root docs/tasks/validator-recert/stage-1 --check --format json

      - name: Scheduler discovery task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/scheduler-discovery --check --format json

      - name: CI governance task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/ci-governance --check --format json

  dependency-policy:
    name: Dependency and security policy
    needs: changes
    if: needs.changes.outputs.dependency == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore cargo-deny cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Dependency and security policy
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          cargo-deny --version
          cargo deny check advisories bans licenses sources

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Core and unit tests
        run: |
          # Database-backed loom-storage and full loom-validator integration suites
          # run in their dedicated lanes instead of starting PostgreSQL here.
          cargo test --workspace --all-features --exclude loom-storage --exclude loom-validator
          cargo test -p loom-storage --all-features --lib
          cargo test -p loom-validator --all-features --lib

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  postgres-contract:
    name: PostgreSQL 18 persistence contract
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: postgres-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            postgres-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: PostgreSQL Compose config
        run: docker compose -f compose.test-db.yaml config --quiet

      - name: PostgreSQL integration contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in crates/loom-storage/tests/postgres_*.rs; do
            test_name="$(basename "$test_file" .rs)"
            echo "::group::$test_name"
            cargo test -p loom-storage --test "$test_name" -- --nocapture
            echo "::endgroup::"
          done

  validator-certification:
    # Keep the historical job/check name stable so existing required-check
    # configuration does not lose its check while the lane becomes regression-only.
    name: Validator authority and T24 certification
    needs: changes
    if: needs.changes.outputs.validator == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The T24 tool-contract regression check reads the merged manifest
          # from origin/main and therefore keeps main history available.
          fetch-depth: 0

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: validator-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            validator-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Validator authority regression gate
        run: bash tools/validator-authority-gate.sh

      - name: Validator T24 certification-tool regression
        run: python3 tools/validator-certification-gate.py --regression-check

  deployment:
    name: Loom server Compose config
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose config
        run: docker compose -f compose.yaml config --quiet
