name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/CODEOWNERS"
      - ".dockerignore"
      - ".env.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "**/*.sql"
      - "capabilities/**"
      - "tests/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "Dockerfile"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/check_architecture.py"
      - "tools/check_storage_sql_ownership.py"
      - "tools/postgres-test.sh"
      - "tools/test_validator_ready.py"
      - "tools/validator_ready.py"
      - "tools/fixtures/validator-ready/**"
      - "docs/tasks/scheduler-discovery/**"
      - "docs/tasks/ci-governance/**"
      - "!apps/loom-validator/**"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/CODEOWNERS"
      - ".dockerignore"
      - ".env.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "**/*.sql"
      - "capabilities/**"
      - "tests/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "Dockerfile"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/check_architecture.py"
      - "tools/check_storage_sql_ownership.py"
      - "tools/postgres-test.sh"
      - "tools/test_validator_ready.py"
      - "tools/validator_ready.py"
      - "tools/fixtures/validator-ready/**"
      - "docs/tasks/scheduler-discovery/**"
      - "docs/tasks/ci-governance/**"
      - "!apps/loom-validator/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  CARGO_DENY_VERSION: "0.18.9"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      dependency: ${{ steps.classify.outputs.dependency }}
      ledger: ${{ steps.classify.outputs.ledger }}
      postgres: ${{ steps.classify.outputs.postgres }}
      deployment: ${{ steps.classify.outputs.deployment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          rust=false
          dependency=false
          ledger=false
          postgres=false
          deployment=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rust=true
            dependency=true
            ledger=true
            postgres=true
            deployment=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="${head}^"
              fi
            fi

            echo "Classifying changes from $base to $head"
            git diff --name-only "$base" "$head" > /tmp/loom-ci-changed-files
            cat /tmp/loom-ci-changed-files

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue

              # Changing core CI authority itself validates every core route once.
              case "$path" in
                .github/workflows/ci.yml|.github/CODEOWNERS)
                  rust=true
                  dependency=true
                  ledger=true
                  postgres=true
                  deployment=true
                  ;;
              esac

              case "$path" in
                Cargo.lock)
                  dependency=true
                  rust=true
                  ;;
                Cargo.toml|*/Cargo.toml|deny.toml)
                  dependency=true
                  rust=true
                  ;;
              esac

              case "$path" in
                docs/tasks/scheduler-discovery/*|docs/tasks/ci-governance/*|tools/validator_ready.py|tools/test_validator_ready.py|tools/fixtures/validator-ready/*)
                  ledger=true
                  ;;
              esac

              case "$path" in
                crates/loom-storage/*|*.sql)
                  postgres=true
                  ;;
                compose.test-db.yaml|tools/postgres-test.sh)
                  postgres=true
                  ;;
              esac

              case "$path" in
                apps/loom-validator/*)
                  ;;
                *.rs|capabilities/*|tests/*|rust-toolchain.toml|rustfmt.toml|tools/check_architecture.py|tools/check_storage_sql_ownership.py)
                  rust=true
                  ;;
              esac

              case "$path" in
                compose.yaml|Dockerfile|.dockerignore|.env.example|docker/*)
                  deployment=true
                  ;;
              esac
            done < /tmp/loom-ci-changed-files
          fi

          {
            echo "rust=$rust"
            echo "dependency=$dependency"
            echo "ledger=$ledger"
            echo "postgres=$postgres"
            echo "deployment=$deployment"
          } >> "$GITHUB_OUTPUT"

          printf 'rust=%s dependency=%s ledger=%s postgres=%s deployment=%s\n' \
            "$rust" "$dependency" "$ledger" "$postgres" "$deployment"

  ledger:
    name: Task ledger governance
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Task ledger READY fixtures
        run: python3 tools/test_validator_ready.py

      - name: Scheduler discovery task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/scheduler-discovery --check --format json

      - name: CI governance task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/ci-governance --check --format json

  dependency-policy:
    name: Dependency and security policy
    needs: changes
    if: needs.changes.outputs.dependency == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore cargo-deny cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Dependency and security policy
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          cargo-deny --version
          cargo deny check advisories bans licenses sources

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --exclude loom-validator --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --exclude loom-validator --all-targets --all-features -- -D warnings

      - name: Core and unit tests
        run: |
          # Database-backed loom-storage integration runs in its dedicated lane.
          # loom-validator is a separate staged validation workflow.
          cargo test --workspace --all-features --exclude loom-storage --exclude loom-validator
          cargo test -p loom-storage --all-features --lib

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude loom-validator --no-deps

  postgres-contract:
    name: PostgreSQL 18 persistence contract
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: postgres-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            postgres-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: PostgreSQL Compose config
        run: docker compose -f compose.test-db.yaml config --quiet

      - name: PostgreSQL integration contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in crates/loom-storage/tests/postgres_*.rs; do
            test_name="$(basename "$test_file" .rs)"
            echo "::group::$test_name"
            cargo test -p loom-storage --test "$test_name" -- --nocapture
            echo "::endgroup::"
          done

  deployment:
    name: Loom server Compose config
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose config
        run: docker compose -f compose.yaml config --quiet
