name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  postgres-contract:
    name: PostgreSQL 18 persistence contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Ephemeral CI-only control connection. Individual tests create/drop their
      # own migrated databases and never share application state.
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control
      LOOM_REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: PostgreSQL schema and migration contract
        run: cargo test -p loom-storage --test postgres_schema -- --nocapture

      - name: PostgreSQL public Runtime/API vertical parity
        run: cargo test -p loom-storage --test postgres_vertical -- --nocapture

      - name: PostgreSQL read parity
        run: cargo test -p loom-storage --test postgres_read -- --nocapture

      - name: PostgreSQL commit and CAS parity
        run: cargo test -p loom-storage --test postgres_commit -- --nocapture

      - name: PostgreSQL Durable Work parity
        run: cargo test -p loom-storage --test postgres_work -- --nocapture

      - name: PostgreSQL stale Work fence regression
        run: cargo test -p loom-storage --test postgres_work_stale_completion -- --nocapture
