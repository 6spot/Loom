name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  postgres-contract:
    name: PostgreSQL 18 persistence contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_test
      LOOM_REQUIRE_POSTGRES_TESTS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: PostgreSQL persistence contract
        run: cargo test -p loom-storage postgres_18 -- --nocapture

  t3-apply:
    name: Temporary T3 commit migration
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/m2-t3-postgresql-commit-cas' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
      - name: Apply and verify
        run: |
          if [ -f crates/loom-storage/src/postgres/commit.rs ]; then
            exit 0
          fi
          python3 tools/m2_t3_apply.py
          python3 tools/m2_t3_fix1.py
          python3 tools/m2_t3_fix2.py
          python3 tools/m2_t3_fix3.py
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Commit generated implementation
        run: |
          if [ -f crates/loom-storage/src/postgres/commit.rs ] && git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/loom-runtime/src/persistence.rs crates/loom-runtime/src/orchestration.rs crates/loom-storage/src/in_memory.rs crates/loom-storage/src/postgres.rs crates/loom-storage/src/postgres/commit.rs tests/loom-composition/subresolution.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "M2-T3: add async PostgreSQL CommitStore foundation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
