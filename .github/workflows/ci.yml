name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "Dockerfile"
      - ".env.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.lock"
      - "**/*.toml"
      - "**/*.rs"
      - "**/*.sql"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/tests/**"
      - "capabilities/**"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "Dockerfile"
      - ".env.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.lock"
      - "**/*.toml"
      - "**/*.rs"
      - "**/*.sql"
      - "**/*.py"
      - "**/*.sh"
      - "**/*.yaml"
      - "**/*.yml"
      - "**/tests/**"
      - "capabilities/**"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  CARGO_DENY_VERSION: "0.18.9"

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: Dependency and security policy
        run: |
          cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          cargo deny check advisories bans licenses sources

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Validator READY fixtures (unit)
        run: python3 tools/test_validator_ready.py

      - name: Validator real ledger governance (real task records)
        run: python3 tools/validator_ready.py --check

      - name: Local PostgreSQL Compose config
        run: docker compose -f compose.test-db.yaml config --quiet

      - name: Loom server Compose config
        run: docker compose -f compose.yaml config --quiet

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: bash tools/test.sh --workspace --all-features

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  postgres-contract:
    name: PostgreSQL 18 persistence contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Ephemeral CI-only control connection. Individual tests create/drop their
      # own migrated databases and never share application state.
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version

      - name: PostgreSQL schema and migration contract
        run: cargo test -p loom-storage --test postgres_schema -- --nocapture

      - name: PostgreSQL World lifecycle contract
        run: cargo test -p loom-storage --test postgres_lifecycle -- --nocapture

      - name: PostgreSQL Template birth transaction contract
        run: >-
          cargo test -p loom-storage --test postgres_lifecycle
          postgres_18_template_birth_is_atomic_and_snapshots_binding -- --nocapture

      - name: PostgreSQL public Runtime/API vertical parity
        run: cargo test -p loom-storage --test postgres_vertical -- --nocapture

      - name: PostgreSQL read parity
        run: cargo test -p loom-storage --test postgres_read -- --nocapture

      - name: PostgreSQL commit and CAS parity
        run: cargo test -p loom-storage --test postgres_commit -- --nocapture

      - name: PostgreSQL Durable Work parity
        run: cargo test -p loom-storage --test postgres_work -- --nocapture

      - name: PostgreSQL stale Work fence regression
        run: cargo test -p loom-storage --test postgres_work_stale_completion -- --nocapture

      - name: PostgreSQL Runtime restart/resume vertical slice
        run: cargo test -p loom-storage --test postgres_restart_resume -- --nocapture

      - name: PostgreSQL Runtime Revision ledger and activation contract
        run: cargo test -p loom-storage --test postgres_revision -- --nocapture

      - name: Validator lifecycle live path on PostgreSQL 18 (VAL-T8)
        run: cargo test -p loom-validator --test lifecycle -- --nocapture

      - name: Validator replay/fork live path on PostgreSQL 18 (VAL-T9 CV-005..CV-009)
        run: cargo test -p loom-validator --test replay_fork -- --nocapture
