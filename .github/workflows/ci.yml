name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - ".github/CODEOWNERS"
      - ".dockerignore"
      - ".env.example"
      - ".env.chronicle.example"
      - "Cargo.toml"
      - "Cargo.lock"
      - "**/Cargo.toml"
      - "**/*.rs"
      - "crates/loom-storage/**"
      - "capabilities/**"
      - "tests/**"
      - "compose.test-db.yaml"
      - "compose.yaml"
      - "compose.chronicle.yaml"
      - "Dockerfile"
      - "docker/**"
      - "deny.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "tools/check_architecture.py"
      - "tools/check_storage_sql_ownership.py"
      - "tools/test_validator_ready.py"
      - "tools/validator_ready.py"
      - "tools/fixtures/validator-ready/**"
      - "docs/tasks/scheduler-discovery/**"
      - "docs/tasks/ci-governance/**"
      - "README.md"
      - "docs/quickstart.md"
      - "docs/operator-guide.md"
      - "apps/chronicle/**"
      - "!apps/loom-validator/**"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  CARGO_DENY_VERSION: "0.18.9"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      dependency: ${{ steps.classify.outputs.dependency }}
      ledger: ${{ steps.classify.outputs.ledger }}
      deployment: ${{ steps.classify.outputs.deployment }}
      documentation: ${{ steps.classify.outputs.documentation }}
      chronicle: ${{ steps.classify.outputs.chronicle }}
      chronicle_python: ${{ steps.classify.outputs.chronicle_python }}
      chronicle_rust: ${{ steps.classify.outputs.chronicle_rust }}
      chronicle_web: ${{ steps.classify.outputs.chronicle_web }}
      chronicle_deployment: ${{ steps.classify.outputs.chronicle_deployment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          rust=false
          dependency=false
          ledger=false
          deployment=false
          documentation=false
          chronicle=false
          chronicle_python=false
          chronicle_rust=false
          chronicle_web=false
          chronicle_deployment=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            rust=true
            dependency=true
            ledger=true
            deployment=true
            documentation=true
            chronicle=true
            chronicle_python=true
            chronicle_rust=true
            chronicle_web=true
            chronicle_deployment=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="${head}^"
              fi
            fi

            echo "Classifying changes from $base to $head"
            git diff --name-only "$base" "$head" > /tmp/loom-ci-changed-files
            cat /tmp/loom-ci-changed-files

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue

              case "$path" in
                .github/workflows/ci.yml|.github/CODEOWNERS)
                  rust=true
                  dependency=true
                  ledger=true
                  deployment=true
                  documentation=true
                  chronicle=true
                  chronicle_python=true
                  chronicle_rust=true
                  chronicle_web=true
                  chronicle_deployment=true
                  ;;
              esac

              case "$path" in
                Cargo.lock)
                  dependency=true
                  rust=true
                  ;;
                Cargo.toml|*/Cargo.toml|deny.toml)
                  dependency=true
                  rust=true
                  ;;
              esac

              case "$path" in
                docs/tasks/scheduler-discovery/*|docs/tasks/ci-governance/*|tools/validator_ready.py|tools/test_validator_ready.py|tools/fixtures/validator-ready/*)
                  ledger=true
                  ;;
              esac

              case "$path" in
                apps/loom-validator/*)
                  ;;
                *.rs|capabilities/*|tests/*|rust-toolchain.toml|rustfmt.toml|tools/check_architecture.py|tools/check_storage_sql_ownership.py|crates/loom-storage/*)
                  rust=true
                  ;;
              esac

              case "$path" in
                compose.yaml|Dockerfile|.dockerignore|.env.example|docker/*)
                  deployment=true
                  ;;
              esac

              case "$path" in
                README.md|docs/quickstart.md|docs/operator-guide.md)
                  documentation=true
                  ;;
              esac

              case "$path" in
                apps/chronicle/*|compose.chronicle.yaml|.env.chronicle.example)
                  chronicle=true
                  ;;
              esac

              case "$path" in
                apps/chronicle/persistence/*|apps/chronicle/read_api/*|apps/chronicle/worker/*|apps/chronicle/ingestion/*)
                  chronicle_python=true
                  ;;
              esac

              case "$path" in
                apps/chronicle/control_plane/*|apps/chronicle/server/*)
                  chronicle_rust=true
                  ;;
              esac

              case "$path" in
                apps/chronicle/web/*|apps/chronicle/webapp/*)
                  chronicle_web=true
                  ;;
              esac

              case "$path" in
                compose.chronicle.yaml|.env.chronicle.example|apps/chronicle/Dockerfile)
                  chronicle_deployment=true
                  ;;
              esac
            done < /tmp/loom-ci-changed-files
          fi

          {
            echo "rust=$rust"
            echo "dependency=$dependency"
            echo "ledger=$ledger"
            echo "deployment=$deployment"
            echo "documentation=$documentation"
            echo "chronicle=$chronicle"
            echo "chronicle_python=$chronicle_python"
            echo "chronicle_rust=$chronicle_rust"
            echo "chronicle_web=$chronicle_web"
            echo "chronicle_deployment=$chronicle_deployment"
          } >> "$GITHUB_OUTPUT"

  documentation:
    name: Active deployment documentation
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate active deployment guidance
        shell: bash
        run: |
          set -euo pipefail

          if grep -REn 'LOOM_SCHEDULER_WORLD_ID|LOOM_SCHEDULER_TIMELINE_ID|docker compose up -d --force-recreate' \
            README.md docs/quickstart.md docs/operator-guide.md; then
            echo "active deployment docs contain removed target or recreate instructions" >&2
            exit 1
          fi

          for document in README.md docs/quickstart.md docs/operator-guide.md; do
            grep -Eq 'docker compose up -d' "$document"
          done
          grep -Eq 'LOOM_WORKER_SCHEDULER_POLL_LIMIT' docs/quickstart.md docs/operator-guide.md
          grep -Eq 'LOOM_WORKER_POLL_MS' docs/quickstart.md docs/operator-guide.md

      - name: Validate Compose configuration and scheduler limit wiring
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml config | grep -Fq 'LOOM_WORKER_SCHEDULER_POLL_LIMIT'

  ledger:
    name: Task ledger governance
    needs: changes
    if: needs.changes.outputs.ledger == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Task ledger READY fixtures
        run: python3 tools/test_validator_ready.py

      - name: Scheduler discovery task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/scheduler-discovery --check --format json

      - name: CI governance task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/ci-governance --check --format json

  dependency-policy:
    name: Dependency and security policy
    needs: changes
    if: needs.changes.outputs.dependency == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore cargo-deny cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Dependency and security policy
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          cargo deny check advisories bans licenses sources

  rust:
    name: Rust static checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-static-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-static-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --exclude loom-validator --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --exclude loom-validator --all-targets --all-features -- -D warnings

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude loom-validator --no-deps

  deployment:
    name: Loom Compose config
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose config
        run: docker compose -f compose.yaml config --quiet

  chronicle-static:
    name: Chronicle static checks
    needs: changes
    if: needs.changes.outputs.chronicle == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python syntax
        if: needs.changes.outputs.chronicle_python == 'true'
        run: |
          python3 -m compileall -q \
            apps/chronicle/persistence \
            apps/chronicle/read_api \
            apps/chronicle/worker \
            apps/chronicle/ingestion

      - name: Install Chronicle Rust toolchain
        if: needs.changes.outputs.chronicle_rust == 'true'
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Chronicle Rust format and static analysis
        if: needs.changes.outputs.chronicle_rust == 'true'
        run: |
          set -euo pipefail
          for manifest in \
            apps/chronicle/control_plane/Cargo.toml \
            apps/chronicle/server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo check --manifest-path "$manifest" --all-targets
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done

      - name: Set up Node
        if: needs.changes.outputs.chronicle_web == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Chronicle web build
        if: needs.changes.outputs.chronicle_web == 'true'
        run: |
          set -euo pipefail
          cd apps/chronicle/webapp
          npm ci
          npm run build
          cd ../../..
          git diff --exit-code -- apps/chronicle/web/dist
          test -z "$(git status --porcelain -- apps/chronicle/web/dist)"

      - name: Chronicle Compose model
        if: needs.changes.outputs.chronicle_deployment == 'true'
        run: |
          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            config --quiet

  repository-gate:
    name: Repository Gate
    if: always()
    needs: [changes, documentation, ledger, dependency-policy, rust, deployment, chronicle-static]
    runs-on: ubuntu-latest

    steps:
      - name: Require successful applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCUMENTATION: ${{ needs.documentation.result }}
          LEDGER: ${{ needs.ledger.result }}
          DEPENDENCY_POLICY: ${{ needs.dependency-policy.result }}
          RUST: ${{ needs.rust.result }}
          DEPLOYMENT: ${{ needs.deployment.result }}
          CHRONICLE_STATIC: ${{ needs.chronicle-static.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "$CHANGES" \
            "$DOCUMENTATION" \
            "$LEDGER" \
            "$DEPENDENCY_POLICY" \
            "$RUST" \
            "$DEPLOYMENT" \
            "$CHRONICLE_STATIC"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Required repository check ended with: $result" >&2
                exit 1
                ;;
            esac
          done

  multica-wakeup:
    name: Notify Multica of CI failure
    needs: [repository-gate]
    if: >
      failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'Multica-Issue:')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/multica-ci-wakeup.yml
    secrets:
      MULTICA_URL: ${{ secrets.MULTICA_URL }}
      MULTICA_PAT: ${{ secrets.MULTICA_PAT }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
