name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"

jobs:
  rust:
    name: Rust ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version
      - name: Architecture policy
        run: python3 tools/check_architecture.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps

  postgres-contract:
    name: PostgreSQL 18 persistence contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_test
      LOOM_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version
          cargo --version
      - name: PostgreSQL persistence contract
        run: cargo test -p loom-storage postgres_18 -- --nocapture

  t2-read-refactor:
    name: Temporary T2 read helper refactor
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/m2-t2-postgresql-read-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Split PostgreSQL read implementation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/loom-storage/src/postgres.rs')
          text = path.read_text()
          text = text.replace(
              'use sqlx::{PgPool, Row, postgres::PgPoolOptions};',
              'use sqlx::{PgConnection, PgPool, Row, postgres::PgPoolOptions};',
              1,
          )
          replacement = r'''#[derive(Clone, Copy)]
struct TimelineHeader {
    world_id: WorldId,
    version: TimelineVersion,
    world_time: WorldInstant,
}

impl PgStorage {
    async fn read_snapshot(&self, timeline_id: TimelineId) -> Result<TimelineSnapshot, ReadError> {
        let mut transaction = self.pool.begin().await.map_err(sql_read_error)?;
        sqlx::query("SET TRANSACTION ISOLATION LEVEL REPEATABLE READ READ ONLY")
            .execute(&mut *transaction)
            .await
            .map_err(sql_read_error)?;

        let header = read_timeline_header(&mut transaction, timeline_id).await?;
        let mut base = BaseWorldSnapshot::new(
            header.world_id,
            timeline_id,
            header.version,
            header.world_time,
        );
        read_structure(&mut transaction, timeline_id, header.world_id, &mut base).await?;
        read_facets(&mut transaction, timeline_id, &mut base).await?;
        let events = read_events(&mut transaction, timeline_id, &mut base).await?;
        let works = read_works(&mut transaction, timeline_id).await?;
        transaction.commit().await.map_err(sql_read_error)?;
        Ok(TimelineSnapshot::new(base, events, works))
    }
}

async fn read_timeline_header(
    connection: &mut PgConnection,
    timeline_id: TimelineId,
) -> Result<TimelineHeader, ReadError> {
    let row = sqlx::query(
        "SELECT world_id::text AS world_id, head_event_seq::text AS head_event_seq, \
                state_revision::text AS state_revision, world_time \
         FROM loom_timeline WHERE timeline_id = $1::uuid",
    )
    .bind(timeline_id.to_string())
    .fetch_optional(connection)
    .await
    .map_err(sql_read_error)?
    .ok_or(ReadError::TimelineNotFound { timeline_id })?;
    Ok(TimelineHeader {
        world_id: parse_identity::<WorldId>(&row_string(&row, "world_id")?, "WorldId")?,
        version: TimelineVersion::new(
            EventSeq::new(parse_u64(&row_string(&row, "head_event_seq")?, "head_event_seq")?),
            StateRevision::new(parse_u64(
                &row_string(&row, "state_revision")?,
                "state_revision",
            )?),
        ),
        world_time: WorldInstant::new(row_i64(&row, "world_time")?),
    })
}

async fn read_structure(
    connection: &mut PgConnection,
    timeline_id: TimelineId,
    world_id: WorldId,
    base: &mut BaseWorldSnapshot,
) -> Result<(), ReadError> {
    let rows = sqlx::query(
        "SELECT entity_id::text AS entity_id FROM loom_entity \
         WHERE timeline_id = $1::uuid ORDER BY entity_id",
    )
    .bind(timeline_id.to_string())
    .fetch_all(&mut *connection)
    .await
    .map_err(sql_read_error)?;
    for row in rows {
        let id = parse_identity::<EntityId>(&row_string(&row, "entity_id")?, "EntityId")?;
        base.insert_entity(Entity { id, world_id });
    }

    let rows = sqlx::query(
        "SELECT relationship_id::text AS relationship_id, relationship_type, active \
         FROM loom_relationship WHERE timeline_id = $1::uuid ORDER BY relationship_id",
    )
    .bind(timeline_id.to_string())
    .fetch_all(&mut *connection)
    .await
    .map_err(sql_read_error)?;
    for row in rows {
        let relationship_id = parse_identity::<RelationshipId>(
            &row_string(&row, "relationship_id")?,
            "RelationshipId",
        )?;
        let participant_rows = sqlx::query(
            "SELECT entity_id::text AS entity_id, role FROM loom_relationship_participant \
             WHERE timeline_id = $1::uuid AND relationship_id = $2::uuid \
             ORDER BY participant_order",
        )
        .bind(timeline_id.to_string())
        .bind(relationship_id.to_string())
        .fetch_all(&mut *connection)
        .await
        .map_err(sql_read_error)?;
        let mut participants = Vec::with_capacity(participant_rows.len());
        for participant in participant_rows {
            participants.push(RelationshipParticipant::new(
                parse_identity::<EntityId>(&row_string(&participant, "entity_id")?, "EntityId")?,
                AssociationRole::from(row_string(&participant, "role")?),
            ));
        }
        base.insert_relationship(
            Relationship::new(
                relationship_id,
                world_id,
                RelationshipTypeId::from(row_string(&row, "relationship_type")?),
                participants,
            ),
            row.try_get("active").map_err(sql_read_error)?,
        );
    }
    Ok(())
}

async fn read_facets(
    connection: &mut PgConnection,
    timeline_id: TimelineId,
    base: &mut BaseWorldSnapshot,
) -> Result<(), ReadError> {
    let entity_rows = sqlx::query(
        "SELECT entity_id::text AS owner_id, facet_type, schema_revision, value \
         FROM loom_entity_facet WHERE timeline_id = $1::uuid ORDER BY entity_id, facet_type",
    )
    .bind(timeline_id.to_string())
    .fetch_all(&mut *connection)
    .await
    .map_err(sql_read_error)?;
    for row in entity_rows {
        base.insert_facet(
            FacetOwner::entity(parse_identity::<EntityId>(&row_string(&row, "owner_id")?, "EntityId")?),
            FacetTypeId::from(row_string(&row, "facet_type")?),
            schema_revision(&row)?,
            row_json(&row, "value")?,
        );
    }
    let relationship_rows = sqlx::query(
        "SELECT relationship_id::text AS owner_id, facet_type, schema_revision, value \
         FROM loom_relationship_facet WHERE timeline_id = $1::uuid \
         ORDER BY relationship_id, facet_type",
    )
    .bind(timeline_id.to_string())
    .fetch_all(connection)
    .await
    .map_err(sql_read_error)?;
    for row in relationship_rows {
        base.insert_facet(
            FacetOwner::relationship(parse_identity::<RelationshipId>(
                &row_string(&row, "owner_id")?,
                "RelationshipId",
            )?),
            FacetTypeId::from(row_string(&row, "facet_type")?),
            schema_revision(&row)?,
            row_json(&row, "value")?,
        );
    }
    Ok(())
}

async fn read_events(
    connection: &mut PgConnection,
    timeline_id: TimelineId,
    base: &mut BaseWorldSnapshot,
) -> Result<Vec<CommittedEvent>, ReadError> {
    let rows = sqlx::query(
        "SELECT event_id::text AS event_id, event_seq::text AS event_seq, event_type, \
                schema_revision, occurred_at, payload, effects \
         FROM loom_event WHERE timeline_id = $1::uuid ORDER BY event_seq",
    )
    .bind(timeline_id.to_string())
    .fetch_all(&mut *connection)
    .await
    .map_err(sql_read_error)?;
    let mut events = Vec::with_capacity(rows.len());
    for row in rows {
        let event_id = parse_identity::<EventId>(&row_string(&row, "event_id")?, "EventId")?;
        let effects: Vec<WorldEffect> = serde_json::from_value(row_json(&row, "effects")?)
            .map_err(|error| corrupt(format!("invalid persisted Event effects: {error}")))?;
        let event_seq = EventSeq::new(parse_u64(&row_string(&row, "event_seq")?, "event_seq")?);
        let mut proposal = ProposedEvent::new(
            event_id,
            EventTypeId::from(row_string(&row, "event_type")?),
            schema_revision(&row)?,
            WorldInstant::new(row_i64(&row, "occurred_at")?),
            row_json(&row, "payload")?,
        );
        proposal.effects = effects;
        let mut event = CommittedEvent::from_proposed(timeline_id, event_seq, &proposal);
        read_event_associations(connection, timeline_id, event_id, &mut event).await?;
        base.insert_event(event_id);
        events.push(event);
    }
    Ok(events)
}

async fn read_event_associations(
    connection: &mut PgConnection,
    timeline_id: TimelineId,
    event_id: EventId,
    event: &mut CommittedEvent,
) -> Result<(), ReadError> {
    let rows = sqlx::query(
        "SELECT entity_id::text AS entity_id, role FROM loom_event_participant \
         WHERE timeline_id = $1::uuid AND event_id = $2::uuid ORDER BY participant_order",
    )
    .bind(timeline_id.to_string())
    .bind(event_id.to_string())
    .fetch_all(&mut *connection)
    .await
    .map_err(sql_read_error)?;
    for row in rows {
        event.push_participant(
            parse_identity::<EntityId>(&row_string(&row, "entity_id")?, "EntityId")?,
            AssociationRole::from(row_string(&row, "role")?),
        );
    }
    let rows = sqlx::query(
        "SELECT relationship_id::text AS relationship_id, role FROM loom_event_relationship_ref \
         WHERE timeline_id = $1::uuid AND event_id = $2::uuid ORDER BY reference_order",
    )
    .bind(timeline_id.to_string())
    .bind(event_id.to_string())
    .fetch_all(&mut *connection)
    .await
    .map_err(sql_read_error)?;
    for row in rows {
        event.push_relationship_ref(
            parse_identity::<RelationshipId>(&row_string(&row, "relationship_id")?, "RelationshipId")?,
            AssociationRole::from(row_string(&row, "role")?),
        );
    }
    let rows = sqlx::query(
        "SELECT cause_event_id::text AS cause_event_id FROM loom_event_causal_link \
         WHERE timeline_id = $1::uuid AND event_id = $2::uuid ORDER BY causal_order",
    )
    .bind(timeline_id.to_string())
    .bind(event_id.to_string())
    .fetch_all(connection)
    .await
    .map_err(sql_read_error)?;
    for row in rows {
        event.push_causal_link(parse_identity::<EventId>(
            &row_string(&row, "cause_event_id")?,
            "EventId",
        )?);
    }
    Ok(())
}

async fn read_works(
    connection: &mut PgConnection,
    timeline_id: TimelineId,
) -> Result<Vec<WorkRecord>, ReadError> {
    let rows = sqlx::query(
        "SELECT work_id::text AS work_id, handler, schema_revision, payload, due_world_time, \
                causal_event_id::text AS causal_event_id, origin_work_id::text AS origin_work_id, \
                status, attempt_count, claim_generation::text AS claim_generation, available_at, \
                last_error, lease_claimed_until, lease_fence::text AS lease_fence \
         FROM loom_work WHERE timeline_id = $1::uuid ORDER BY work_id",
    )
    .bind(timeline_id.to_string())
    .fetch_all(connection)
    .await
    .map_err(sql_read_error)?;
    let mut works = Vec::with_capacity(rows.len());
    for row in rows {
        let work_id = parse_identity::<WorkId>(&row_string(&row, "work_id")?, "WorkId")?;
        let lease_until: Option<i64> = row.try_get("lease_claimed_until").map_err(sql_read_error)?;
        let lease_fence: Option<String> = row.try_get("lease_fence").map_err(sql_read_error)?;
        let lease = match (lease_until, lease_fence) {
            (None, None) => None,
            (Some(until), Some(fence)) => Some(WorkLease::new(
                PlatformTime::new(until),
                parse_u64(&fence, "lease_fence")?,
            )),
            _ => return Err(corrupt("persisted Work lease columns disagree")),
        };
        works.push(WorkRecord {
            id: work_id,
            timeline_id,
            handler: WorkHandlerId::from(row_string(&row, "handler")?),
            schema_revision: schema_revision(&row)?,
            payload: row_json(&row, "payload")?,
            due_world_time: row.try_get::<Option<i64>, _>("due_world_time").map_err(sql_read_error)?.map(WorldInstant::new),
            causal_event_id: optional_identity::<EventId>(&row, "causal_event_id", "EventId")?,
            origin_work_id: optional_identity::<WorkId>(&row, "origin_work_id", "WorkId")?,
            status: parse_work_status(&row_string(&row, "status")?)?,
            attempt_count: u32::try_from(row_i64(&row, "attempt_count")?)
                .map_err(|_| corrupt("attempt_count exceeds u32"))?,
            claim_generation: parse_u64(&row_string(&row, "claim_generation")?, "claim_generation")?,
            available_at: PlatformTime::new(row_i64(&row, "available_at")?),
            last_error: row.try_get("last_error").map_err(sql_read_error)?,
            lease,
        });
    }
    Ok(works)
}

'''
