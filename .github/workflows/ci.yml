name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"
  CARGO_DENY_VERSION: "0.18.9"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify affected contracts
        id: classify
        run: python3 tools/ci_routing.py classify --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  routing-tests:
    name: CI routing and workflow contracts
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r tools/requirements-ci.txt
      - run: python3 -m unittest discover -s tools -p 'test_ci_routing.py' -v

  documentation:
    name: Documentation and operational examples
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['documentation']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate active deployment guidance
        if: fromJSON(needs.changes.outputs.plan).steps.active_docs
        shell: bash
        run: |
          set -euo pipefail

          if grep -REn 'LOOM_SCHEDULER_WORLD_ID|LOOM_SCHEDULER_TIMELINE_ID|docker compose up -d --force-recreate' \
            README.md docs/quickstart.md docs/operator-guide.md; then
            echo "active deployment docs contain removed target or recreate instructions" >&2
            exit 1
          fi

          for document in README.md docs/quickstart.md docs/operator-guide.md; do
            grep -Eq 'docker compose up -d' "$document"
          done
          grep -Eq 'LOOM_WORKER_SCHEDULER_POLL_LIMIT' docs/quickstart.md docs/operator-guide.md
          grep -Eq 'LOOM_WORKER_POLL_MS' docs/quickstart.md docs/operator-guide.md

      - name: Validate Compose configuration and scheduler limit wiring
        if: fromJSON(needs.changes.outputs.plan).steps.active_docs
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml config | grep -Fq 'LOOM_WORKER_SCHEDULER_POLL_LIMIT'

      - name: Check changed documentation links
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: python3 tools/ci_routing.py docs

  skill-tools:
    name: Repository skill tool checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['skill-tools']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Historical background archive offline tests
        run: python3 -m unittest discover -s .agents/skills/historical-background-art/scripts -p 'test_library.py' -v

  ledger:
    name: Task ledger governance
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['ledger']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Task ledger READY fixtures
        run: python3 tools/test_validator_ready.py

      - name: Scheduler discovery task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/scheduler-discovery --check --format json

      - name: CI governance task ledger
        run: python3 tools/validator_ready.py --root docs/tasks/ci-governance --check --format json

  dependency-policy:
    name: Dependency and security policy
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['dependency-policy']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Restore cargo-deny cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ env.CARGO_DENY_VERSION }}

      - name: Dependency and security policy
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          cargo deny check advisories bans licenses sources

  rust:
    name: Rust static checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['rust']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-static-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-static-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Architecture policy
        run: python3 tools/check_architecture.py

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --exclude loom-validator --all-targets --all-features

      - name: Clippy
        run: cargo clippy --workspace --exclude loom-validator --all-targets --all-features -- -D warnings

      - name: Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc --workspace --exclude loom-validator --no-deps

  deployment:
    name: Loom Compose config
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['deployment']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose config
        run: docker compose -f compose.yaml config --quiet

  chronicle-static:
    name: Chronicle static checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['chronicle-static']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python syntax
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_python
        run: |
          python3 -m compileall -q \
            apps/chronicle/persistence \
            apps/chronicle/read_api \
            apps/chronicle/worker \
            apps/chronicle/ingestion \
            apps/chronicle/acceptance

      - name: Chapter generation, correction and provider regressions
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_python
        run: |
          python3 -m pip install -r apps/chronicle/persistence/requirements.txt -r apps/chronicle/worker/requirements.txt
          python3 -m unittest discover -s apps/chronicle/ingestion/prototype -p 'test_resolution_model.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_identity_candidates_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_catalog_publication_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/read_api -p 'test_server_boundary.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_*extraction_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_chapter_correction_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_chapter_production_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_chapter_content_review_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_staged_chapter_contract_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/read_api -p 'test_studio_jobs_projection.py' -v
          python3 -m unittest discover -s apps/chronicle/worker -p '*_unit.py' -v

      - name: Install Chronicle Rust toolchain
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Chronicle Rust format and static analysis
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_rust
        run: |
          set -euo pipefail
          for manifest in \
            apps/chronicle/control_plane/Cargo.toml \
            apps/chronicle/server/Cargo.toml; do
            cargo fmt --manifest-path "$manifest" -- --check
            cargo check --manifest-path "$manifest" --all-targets
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
          done
          cargo test --manifest-path apps/chronicle/server/Cargo.toml

      - name: Set up Node
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_web
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Chronicle web build
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_web
        run: |
          set -euo pipefail
          cd apps/chronicle/webapp
          npm ci
          npm run build
          cd ../../..
          git diff --exit-code -- apps/chronicle/web/dist
          test -z "$(git status --porcelain -- apps/chronicle/web/dist)"

      - name: Chronicle Compose model
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_deployment
        run: |
          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            config --quiet

  chronicle-first-round:
    name: Chronicle first-round checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['chronicle-first-round']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: First-round acceptance corpus tests
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_corpus
        run: |
          python3 -m unittest discover -s apps/chronicle/corpus -p 'test_first_round_pack.py' -v
          python3 -m unittest discover -s apps/chronicle/corpus -p 'test_source_pack_unit.py' -v

      - name: Install persistence test dependencies
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_contract
        run: python3 -m pip install -r apps/chronicle/persistence/requirements.txt

      - name: Migration-only and chapter contract tests
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_contract
        run: |
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_migrate_only_unit.py' -v
          python3 -m unittest discover -s apps/chronicle/persistence -p 'test_chapter_contract_unit.py' -v

      - name: First-round note front-matter check
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_first_round
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: python3 tools/ci_routing.py notes --round first

  chronicle-third-round:
    name: Chronicle third-round note and deliverable checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['chronicle-third-round']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Third-round note front-matter check
        if: fromJSON(needs.changes.outputs.plan).steps.chronicle_third_round
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
        run: python3 tools/ci_routing.py notes --round third
      - name: Third-round acceptance deliverables
        run: |
          for deliverable in \
            apps/chronicle/acceptance/third_round_gate.py \
            apps/chronicle/acceptance/test_third_round_gate.py \
            apps/chronicle/webapp/scripts/person-state-flow-smoke.mjs \
            apps/chronicle/docs/person-state-acceptance.md; do
            test -f "$deliverable"
          done

  chronicle:
    name: Chronicle contract checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs.chronicle
    uses: ./.github/workflows/chronicle.yml
    with:
      plan: ${{ needs.changes.outputs.plan }}

  repository-gate:
    name: Repository Gate
    if: always()
    needs: [changes, routing-tests, documentation, skill-tools, ledger, dependency-policy, rust, deployment, chronicle-static, chronicle-first-round, chronicle-third-round, chronicle]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require every selected check to succeed
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_routing.py gate --group repository

  multica-wakeup:
    name: Notify Multica of CI failure
    needs: [repository-gate]
    if: >
      failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'Multica-Issue:')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/multica-ci-wakeup.yml
    secrets:
      MULTICA_URL: ${{ secrets.MULTICA_URL }}
      MULTICA_PAT: ${{ secrets.MULTICA_PAT }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
