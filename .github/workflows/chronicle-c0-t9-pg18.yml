name: Chronicle C0-T9 PG18

on:
  push:
    branches:
      - feat/chronicle-c0-t9-postgres
    paths:
      - ".github/workflows/chronicle-c0-t9-pg18.yml"
      - "apps/chronicle/persistence/**"
      - "apps/chronicle/ingestion/schemas/chronicle-v0.1.schema.json"
      - "apps/chronicle/ingestion/schemas/chronicle-resolution-v0.1.schema.json"
      - "apps/chronicle/ingestion/schemas/chronicle-canonical-v0.1.schema.json"

permissions:
  contents: read

concurrency:
  group: chronicle-c0-t9-pg18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Chronicle PostgreSQL 18 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/chronicle/persistence/requirements.txt

      - name: Install Chronicle persistence dependencies
        run: python -m pip install -r apps/chronicle/persistence/requirements.txt

      - name: Chronicle PostgreSQL integration tests
        run: |
          python -m unittest discover \
            -s apps/chronicle/persistence \
            -p 'test_*.py' \
            -v
