name: Temporary Chronicle R17 review-subject implementation

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/chronicle-r17-review-subjects
    paths:
      - ".github/workflows/tmp-r17-review-subjects.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout temporary implementation branch
        uses: actions/checkout@v7
        with:
          ref: tmp/chronicle-r17-review-subjects
          fetch-depth: 0

      - name: Apply integration patch
        run: python3 tools/tmp_r17_apply.py

      - name: Normalize localization patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src_test = Path("apps/chronicle/webapp/src/pages/studio/StudioLocalization.test.ts")
          dst_test = Path("apps/chronicle/webapp/tests/studio-localization.test.ts")
          if src_test.exists():
              moved = src_test.read_text(encoding="utf-8")
              moved = moved.replace('../../lib/', '../src/lib/')
              moved = moved.replace('../../components/', '../src/components/')
              moved = moved.replace(
                  'const STUDIO_DIR = new URL(".", import.meta.url);',
                  'const STUDIO_DIR = new URL("../src/pages/studio/", import.meta.url);',
              )
              dst_test.write_text(moved, encoding="utf-8")
              src_test.unlink()

          coverage_page = Path("apps/chronicle/webapp/src/pages/studio/StudioCoveragePage.tsx")
          text = coverage_page.read_text(encoding="utf-8")
          text = text.replace("list文献", "listDocuments")
          coverage_page.write_text(text, encoding="utf-8")

          sources_page = Path("apps/chronicle/webapp/src/pages/studio/StudioSourcesPage.tsx")
          text = sources_page.read_text(encoding="utf-8")
          text = text.replace("list版本s", "listRevisions")
          text = text.replace("upload版本", "uploadRevision")
          sources_page.write_text(text, encoding="utf-8")

          review_detail = Path("apps/chronicle/webapp/src/pages/studio/StudioReviewDetailPage.tsx")
          text = review_detail.read_text(encoding="utf-8")
          text = text.replace("  formatShortHash,\n", "")
          review_detail.write_text(text, encoding="utf-8")

          coverage_test = Path("apps/chronicle/webapp/tests/studio-coverage.test.ts")
          text = coverage_test.read_text(encoding="utf-8")
          text = text.replace('"Source contribution"', '"来源贡献"')
          text = text.replace('"Actionable gaps"', '"可行动缺口"')
          coverage_test.write_text(text, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/chronicle/persistence/requirements.txt
            apps/chronicle/read_api/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install -r apps/chronicle/persistence/requirements.txt
          python -m pip install -r apps/chronicle/read_api/requirements.txt

      - name: Run R16 review-subject regression
        run: python apps/chronicle/persistence/test_review_subjects_r16_unit.py

      - name: Run persistence unit contracts
        run: python -m unittest discover -s apps/chronicle/persistence -p 'test_*unit.py' -v

      - name: Run read-api contracts
        run: python -m unittest discover -s apps/chronicle/read_api -p 'test_*.py' -v

      - name: Run R15 human-review projection regression
        run: python apps/chronicle/read_api/test_studio_reviews_r15_projection_unit.py

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Test and build Studio
        run: |
          cd apps/chronicle/webapp
          npm ci
          npm test
          npm run build
          npm run smoke:dist

      - name: Verify patch quality
        run: |
          git diff --check
          ! grep -R -E "list文献|list版本s|upload版本" -n apps/chronicle/webapp/src
          git status --short

      - name: Commit tested implementation and generated dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/chronicle-live-model.yml \
            apps/chronicle/persistence/resolve_publish.py \
            apps/chronicle/read_api/studio_reviews.py \
            apps/chronicle/webapp/src/lib/studio-api.ts \
            apps/chronicle/webapp/src/pages/studio \
            apps/chronicle/webapp/tests \
            apps/chronicle/web/dist \
            docs/tasks/chronicle/C1-T17-final-acceptance-gate.md
          git commit -m 'feat(chronicle): collapse review debt and localize Studio [skip ci]'
          git push origin HEAD:tmp/chronicle-r17-review-subjects
