          for file_path, pairs in replacements.items():
              text = read(file_path)
              for old, new in pairs:
                  text = text.replace(old, new)
              write(file_path, text)

          # Shared status/stage labels in imports/detail.
          path = "apps/chronicle/webapp/src/pages/studio/StudioImportDetailPage.tsx"
          text = read(path)
          if 'from "../../lib/studio-i18n"' not in text:
              text = text.replace(
                  'import { useStudioAuth } from "../../lib/studio-auth";\n',
                  'import { useStudioAuth } from "../../lib/studio-auth";\nimport { stageLabel, studioStatusLabel } from "../../lib/studio-i18n";\n',
                  1,
              )
          text = re.sub(
              r'\nfunction statusLabel\(status: string\): string \{.*?\n\}\n',
              '\n', text, count=1, flags=re.S,
          )
          text = text.replace("statusLabel(", "studioStatusLabel(")
          write(path, text)

          path = "apps/chronicle/webapp/src/pages/studio/StudioImportsPage.tsx"
          text = read(path)
          if 'from "../../lib/studio-i18n"' not in text:
              text = text.replace(
                  'import { useStudioAuth } from "../../lib/studio-auth";\n',
                  'import { useStudioAuth } from "../../lib/studio-auth";\nimport { studioStatusLabel } from "../../lib/studio-i18n";\n',
                  1,
              )
          text = re.sub(
              r'\nfunction statusLabel\(status: string\): string \{.*?\n\}\n',
              '\n', text, count=1, flags=re.S,
          )
          text = text.replace("statusLabel(", "studioStatusLabel(")
          write(path, text)

          # Coverage density badges become human-readable without touching API values.
          path = "apps/chronicle/webapp/src/pages/studio/StudioCoveragePage.tsx"
          text = read(path)
          if 'from "../../lib/studio-i18n"' not in text:
              text = text.replace(
                  'import { useStudioAuth } from "../../lib/studio-auth";\n',
                  'import { useStudioAuth } from "../../lib/studio-auth";\nimport { densityLabel } from "../../lib/studio-i18n";\n',
                  1,
              )
          text = text.replace("<Badge>{item.density}</Badge>", "<Badge>{densityLabel(item.density)}</Badge>")
          write(path, text)

          # T17 ledger records the real-machine blockers without marking acceptance complete.
          path = "docs/tasks/chronicle/C1-T17-final-acceptance-gate.md"
          text = read(path)
          additions = '''
          - 2026-09-06 — R15 reached the real human resolution gate with 39 ReviewItems and proved the authority pause works, but exposed that the Studio review detail was not human-decidable: raw temp IDs/JSON and mixed English/Chinese obscured the exact source evidence. Issue #536 added a zh-CN, evidence-first review projection; exact-head CI later passed before R16.
          - 2026-09-06 — R16 then exposed candidate-pair review-debt multiplication: repeated representations such as 曹操 / 操 / 曹公 could require several semantically equivalent operator decisions. Issue #537 and Architecture Amendment 0007 refine only ReviewItem materialization to proven semantic component pairs; candidate generation, final C0 link artifacts and canonical publication remain unchanged. Issue #538 simultaneously completes the Studio zh-CN operator surface. R16 is preserved as real-machine evidence and is not a final PASS run.
          '''
          if "R16 then exposed candidate-pair review-debt multiplication" not in text:
              text = text.rstrip() + "\n" + additions
          write(path, text)

          # Exact-head Live contract must be triggered by this whole refinement and
          # explicitly run the pure R16 aggregation regression before the real provider.
          path = ".github/workflows/chronicle-live-model.yml"
          text = read(path)
          text = text.replace(
              '      - "apps/chronicle/read_api/studio_reviews.py"\n',
              '      - "apps/chronicle/persistence/resolve_publish.py"\n'
              '      - "apps/chronicle/persistence/review_subjects.py"\n'
              '      - "apps/chronicle/persistence/test_review_subjects_r16_unit.py"\n'
              '      - "apps/chronicle/read_api/studio_reviews.py"\n',
              1,
          )
          text = text.replace(
              '      - "apps/chronicle/webapp/src/pages/studio/StudioReviewDetailPage.tsx"\n',
              '      - "apps/chronicle/webapp/src/lib/studio-i18n.ts"\n'
              '      - "apps/chronicle/webapp/src/pages/studio/**"\n'
              '      - "apps/chronicle/webapp/src/pages/studio/StudioReviewDetailPage.tsx"\n',
              1,
          )
          text = text.replace(
              '''      - name: Validate R15 human-review projection
                run: python apps/chronicle/read_api/test_studio_reviews_r15_projection_unit.py

''',
              '''      - name: Validate R15 human-review projection
                run: python apps/chronicle/read_api/test_studio_reviews_r15_projection_unit.py

              - name: Validate R16 review-subject collapse
                run: python apps/chronicle/persistence/test_review_subjects_r16_unit.py

''',
              1,
          )
          write(path, text)
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/chronicle/persistence/requirements.txt
            apps/chronicle/read_api/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install -r apps/chronicle/persistence/requirements.txt
          python -m pip install -r apps/chronicle/read_api/requirements.txt

      - name: Run focused R16 review-subject regression
        run: python apps/chronicle/persistence/test_review_subjects_r16_unit.py

      - name: Run persistence unit suite
        run: |
          python -m unittest discover -s apps/chronicle/persistence -p 'test_*unit.py' -v

      - name: Run read-api unit suite
        run: |
          python -m unittest discover -s apps/chronicle/read_api -p 'test_*unit.py' -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Test and build zh-CN Studio
        run: |
          cd apps/chronicle/webapp
          npm ci
          npm test
          npm run build
          npm run smoke:dist

      - name: Verify temporary implementation diff
        run: |
          git diff --check
          git status --short

      - name: Commit tested implementation and generated dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/chronicle-live-model.yml \
            apps/chronicle/persistence/resolve_publish.py \
            apps/chronicle/read_api/studio_reviews.py \
            apps/chronicle/webapp/src/lib/studio-api.ts \
            apps/chronicle/webapp/src/pages/studio \
            apps/chronicle/web/dist \
            docs/tasks/chronicle/C1-T17-final-acceptance-gate.md
          git commit -m 'feat(chronicle): collapse review debt and localize Studio [skip ci]'
          git push origin HEAD:tmp/chronicle-r17-review-subjects
