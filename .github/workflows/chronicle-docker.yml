name: Chronicle Docker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chronicle-docker.yml"
      - "compose.chronicle.yaml"
      - ".env.chronicle.example"
      - "apps/chronicle/Dockerfile"
      - "apps/chronicle/persistence/**"
      - "apps/chronicle/server/**"
      - "apps/chronicle/worker/**"
      - "apps/chronicle/docs/server.md"
      - "apps/chronicle/docs/worker.md"
      - "apps/chronicle/read_api/**"
      - "apps/chronicle/web/**"
      - "apps/chronicle/webapp/**"
      - "apps/chronicle/.artifacts/**"
      - "apps/chronicle/ingestion/schemas/**"
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: chronicle-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify Chronicle Docker changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify Chronicle Docker changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          relevant=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            relevant=true
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
            else
              base="${{ github.event.before }}"
              head="${{ github.sha }}"
              if [[ "$base" =~ ^0+$ ]]; then
                base="${head}^"
              fi
            fi

            git diff --name-only "$base" "$head" > /tmp/chronicle-docker-changed-files
            cat /tmp/chronicle-docker-changed-files

            while IFS= read -r path; do
              [[ -n "$path" ]] || continue
              case "$path" in
                .github/workflows/chronicle-docker.yml|compose.chronicle.yaml|.env.chronicle.example|apps/chronicle/Dockerfile|apps/chronicle/persistence/*|apps/chronicle/server/*|apps/chronicle/worker/*|apps/chronicle/docs/server.md|apps/chronicle/docs/worker.md|apps/chronicle/read_api/*|apps/chronicle/web/*|apps/chronicle/webapp/*|apps/chronicle/.artifacts/*|apps/chronicle/ingestion/schemas/*)
                  relevant=true
                  break
                  ;;
              esac
            done < /tmp/chronicle-docker-changed-files
          fi

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant"

  compose:
    name: Chronicle Docker deployment contract
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    env:
      CHRONICLE_POSTGRES_USER: chronicle
      CHRONICLE_POSTGRES_PASSWORD: ci-test-postgres-password
      CHRONICLE_POSTGRES_DB: chronicle
      CHRONICLE_DATA_DIR: /tmp/loom-chronicle-ci
      CHRONICLE_BIND_IP: 127.0.0.1
      CHRONICLE_PORT: "18080"
      CHRONICLE_IMAGE_TAG: ci
      CHRONICLE_ADMIN_USER: ci-studio-admin
      CHRONICLE_ADMIN_PASSWORD: ci-test-admin-password-0000000000000000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose model
        run: |
          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            config >/tmp/chronicle-compose.yaml

      - name: Start Chronicle stack
        run: |
          set -euo pipefail
          mkdir -p "$CHRONICLE_DATA_DIR/postgres"
          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            up -d --build

          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${CHRONICLE_PORT}/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            docker compose \
              --env-file .env.chronicle.example \
              -f compose.chronicle.yaml \
              ps -a
            docker compose \
              --env-file .env.chronicle.example \
              -f compose.chronicle.yaml \
              logs
            exit 1
          fi

      - name: Verify imported world through HTTP
        run: |
          set -euo pipefail

          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            logs chronicle-init | tee /tmp/chronicle-init.log

          grep -q "entities=66 events=45 relations=2" /tmp/chronicle-init.log

          curl -fsSG \
            --data-urlencode 'q=曹操' \
            "http://127.0.0.1:${CHRONICLE_PORT}/v0/search" \
            >/tmp/chronicle-search.json

          curl -fsSG \
            --data-urlencode 'q=曹操' \
            "http://127.0.0.1:${CHRONICLE_PORT}/api/v1/public/search" \
            >/tmp/chronicle-search-public.json

          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:${CHRONICLE_PORT}/api/v1/studio/status")
          [ "$code" = "401" ]
          curl -fsS -u "$CHRONICLE_ADMIN_USER:$CHRONICLE_ADMIN_PASSWORD" \
            "http://127.0.0.1:${CHRONICLE_PORT}/api/v1/studio/status" \
            >/tmp/chronicle-studio.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/chronicle-search.json').read_text())
          matches = [
              item for item in payload['items']
              if item['kind'] == 'entity' and item['display'].get('name') == '曹操'
          ]
          assert len(matches) == 1, matches
          assert matches[0]['source_count'] == 2, matches[0]

          public = json.loads(Path('/tmp/chronicle-search-public.json').read_text())
          assert public == payload, 'public namespace diverged from legacy route'

          studio_text = Path('/tmp/chronicle-studio.json').read_text()
          assert 'ci-test-admin-password' not in studio_text, 'password leaked'
          studio = json.loads(studio_text)
          assert studio['schema'] == 'chronicle.studio-status', studio
          assert studio['admin_user'] == 'ci-studio-admin', studio
          assert studio['upstream']['reachable'] is True, studio
          print('chronicle docker smoke: PASS')
          PY

      - name: Show final container state
        run: |
          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            ps -a

      - name: Stop Chronicle stack
        if: always()
        run: |
          docker compose \
            --env-file .env.chronicle.example \
            -f compose.chronicle.yaml \
            down --remove-orphans || true
          sudo rm -rf "$CHRONICLE_DATA_DIR" || true

  chronicle-docker-gate:
    name: Chronicle Docker Gate
    if: always()
    needs: [changes, compose]
    runs-on: ubuntu-latest

    steps:
      - name: Require successful applicable checks
        env:
          CHANGES: ${{ needs.changes.result }}
          COMPOSE: ${{ needs.compose.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CHANGES" "$COMPOSE"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Required Chronicle Docker job ended with: $result" >&2
                exit 1
                ;;
            esac
          done

  multica-wakeup:
    name: Notify Multica of CI failure
    needs: [chronicle-docker-gate]
    if: >
      failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'Multica-Issue:')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/multica-ci-wakeup.yml
    secrets:
      MULTICA_URL: ${{ secrets.MULTICA_URL }}
      MULTICA_PAT: ${{ secrets.MULTICA_PAT }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
