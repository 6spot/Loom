name: Temporary Chronicle C1-T17 R9 response limit

on:
  push:
    branches:
      - tmp/chronicle-c1-t17-r9-response-limit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/chronicle-c1-t17-r9-response-limit
      - name: Patch deterministic response envelope and R9 regression
        shell: python
        run: |
          from pathlib import Path

          extraction = Path("apps/chronicle/persistence/extraction.py")
          text = extraction.read_text(encoding="utf-8")
          old = '''    # R6 of the C1-T17 real-machine gate measured a schema-shaped response
          # of 26,706 chars for a ~2K-char classical-Chinese chunk. 16K was an
          # uncalibrated development guard, not a contract limit. Keep a hard,
          # deterministic bound while leaving enough room for real staged bundles.
          max_response_chars: int = 32768
          '''
          new = '''    # C1-T17 live runs measured complete model bundles at 26,706 chars (R6)
          # and 32,856 / 41,280 chars (R9) for ~2K-char classical-Chinese chunks.
          # This is a resource-protection envelope, not a semantic compactness rule:
          # keep it hard and deterministic, never truncate, and let canonical
          # parse/schema/grounding validation decide whether an in-envelope bundle is valid.
          max_response_chars: int = 65536
          '''
          if text.count(old) != 1:
              raise SystemExit("extraction.py response-limit anchor drifted")
          extraction.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests_path = Path("apps/chronicle/persistence/test_extraction_live_limits_unit.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_test = '''    def test_default_response_guard_accepts_r6_observed_size(self) -> None:
              self.assertEqual(32768, X.ExtractionConfig().max_response_chars)
              self.assertGreater(X.ExtractionConfig().max_response_chars, 26706)
          '''
          new_test = '''    def test_default_response_guard_accepts_r9_observed_sizes(self) -> None:
              self.assertEqual(65536, X.ExtractionConfig().max_response_chars)
              self.assertGreater(X.ExtractionConfig().max_response_chars, 26706)
              self.assertGreater(X.ExtractionConfig().max_response_chars, 32856)
              self.assertGreater(X.ExtractionConfig().max_response_chars, 41280)

              def test_r9_measured_large_bundle_reaches_normal_validation(self) -> None:
                  config = X.ExtractionConfig(max_repair_attempts=0)
                  good = valid_bundle(CHUNK_0, "劉表卒", time_original="建安十三年")
                  good["warnings"] = [
                      {
                          "type": "r9_size_regression",
                          "severity": "info",
                          "message": "x" * 41000,
                          "refs": [],
                      }
                  ]
                  raw = json.dumps(good, ensure_ascii=False)
                  self.assertGreater(len(raw), 41280)
                  self.assertLess(len(raw), config.max_response_chars)
                  provider = FakeProvider([raw])

                  result = self._run(provider, config=config)

                  self.assertTrue(result["accepted"], result["error"])
                  self.assertIsNone(result["attempts"][0]["parse_error"])
                  self.assertTrue(result["attempts"][0]["validation"]["passed"])
          '''
          if tests.count(old_test) != 1:
              raise SystemExit("live-limit test anchor drifted")
          tests_path.write_text(tests.replace(old_test, new_test, 1), encoding="utf-8")
      - name: Compile extraction modules
        run: python -m py_compile apps/chronicle/persistence/extraction.py apps/chronicle/persistence/test_extraction_live_limits_unit.py
      - name: Run extraction unit contracts
        run: python apps/chronicle/persistence/test_extraction_unit.py -v
      - name: Run live-limit regressions
        run: python apps/chronicle/persistence/test_extraction_live_limits_unit.py -v
      - name: Run R8 schema-shape regressions
        run: python apps/chronicle/persistence/test_extraction_r8_contract_unit.py -v
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/chronicle/persistence/extraction.py apps/chronicle/persistence/test_extraction_live_limits_unit.py
          git diff --cached --check
          git commit -m "fix(chronicle): recalibrate extraction response envelope from R9"
          git push origin HEAD:tmp/chronicle-c1-t17-r9-response-limit
