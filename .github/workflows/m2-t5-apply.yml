name: M2 T5 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  RUST_VERSION: "1.97.1"

jobs:
  apply:
    if: github.head_ref == 'feat/m2-t5-postgresql-test-infra' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control
      LOOM_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Apply and verify T5 isolation changes
        run: |
          python3 tools/m2_t5_apply.py
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p loom-storage --test postgres_schema -- --nocapture
          cargo test -p loom-storage --test postgres_read -- --nocapture
          cargo test -p loom-storage --test postgres_commit -- --nocapture
          cargo test -p loom-storage --test postgres_work -- --nocapture
          cargo test -p loom-storage --test postgres_work_stale_completion -- --nocapture

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Cargo.lock crates/loom-storage/tests/postgres_read.rs crates/loom-storage/tests/postgres_commit.rs crates/loom-storage/tests/postgres_work.rs crates/loom-storage/tests/postgres_work_stale_completion.rs
          git commit -m "M2-T5: isolate PostgreSQL integration databases"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
