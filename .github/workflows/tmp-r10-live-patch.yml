name: TMP Chronicle Strict Extraction Validation

on:
  push:
    branches:
      - tmp/chronicle-r10-live-model-contract

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHRONICLE_MODEL_ENDPOINT: ${{ secrets.CHRONICLE_MODEL_ENDPOINT }}
      CHRONICLE_MODEL_API_KEY: ${{ secrets.CHRONICLE_MODEL_API_KEY }}
      CHRONICLE_EXTRACTION_MODEL: ${{ secrets.CHRONICLE_EXTRACTION_MODEL }}
      CHRONICLE_PRESENTATION_MODEL: ${{ secrets.CHRONICLE_PRESENTATION_MODEL }}
      CHRONICLE_MODEL_TIMEOUT_SECONDS: "600"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/chronicle-r10-live-model-contract

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/chronicle/persistence/requirements.txt

      - name: Compile semantic patch helper
        run: python -m py_compile apps/chronicle/acceptance/tmp_apply_semantic_contract.py

      - name: Apply semantic prompt and validator correction
        run: python apps/chronicle/acceptance/tmp_apply_semantic_contract.py

      - name: Compile changed modules
        run: python -m py_compile apps/chronicle/worker/extraction_model_schema.py apps/chronicle/worker/model_provider.py apps/chronicle/persistence/extraction.py apps/chronicle/persistence/extraction_prompt.py apps/chronicle/acceptance/live_model_contract.py

      - name: Install Chronicle dependencies
        run: python -m pip install -r apps/chronicle/persistence/requirements.txt

      - name: Run provider and extraction contracts
        run: |
          python apps/chronicle/worker/test_extraction_model_schema_unit.py -v
          python apps/chronicle/worker/test_model_provider_unit.py -v
          python apps/chronicle/worker/test_model_provider_retry_unit.py -v
          python apps/chronicle/persistence/test_extraction_unit.py -v
          python apps/chronicle/persistence/test_extraction_live_limits_unit.py -v
          python apps/chronicle/persistence/test_extraction_r8_contract_unit.py -v

      - name: Validate live secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in CHRONICLE_MODEL_ENDPOINT CHRONICLE_MODEL_API_KEY CHRONICLE_EXTRACTION_MODEL CHRONICLE_PRESENTATION_MODEL; do
            [ -n "${!name:-}" ] || { echo "missing required secret: $name" >&2; exit 1; }
          done
          echo 'live model secret presence: PASS'

      - name: Run real Luna extraction contract with strict canonical projection
        run: python apps/chronicle/acceptance/live_model_contract.py

      - name: Commit validated implementation when live contract passes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/chronicle/worker/extraction_model_schema.py \
            apps/chronicle/worker/test_extraction_model_schema_unit.py \
            apps/chronicle/worker/model_provider.py \
            apps/chronicle/worker/test_model_provider_unit.py \
            apps/chronicle/persistence/extraction.py \
            apps/chronicle/persistence/extraction_prompt.py \
            apps/chronicle/persistence/test_extraction_unit.py \
            apps/chronicle/persistence/test_extraction_r8_contract_unit.py \
            apps/chronicle/acceptance/live_model_contract.py \
            .github/workflows/chronicle-live-model.yml
          if git diff --cached --quiet; then
            echo 'validated implementation already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tmp: validate strict Chronicle extraction output'
          git push origin HEAD:tmp/chronicle-r10-live-model-contract
