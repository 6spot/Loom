name: TMP Chronicle R10 Live Patch

on:
  push:
    branches:
      - tmp/chronicle-r10-live-model-contract

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHRONICLE_MODEL_ENDPOINT: ${{ secrets.CHRONICLE_MODEL_ENDPOINT }}
      CHRONICLE_MODEL_API_KEY: ${{ secrets.CHRONICLE_MODEL_API_KEY }}
      CHRONICLE_EXTRACTION_MODEL: ${{ secrets.CHRONICLE_EXTRACTION_MODEL }}
      CHRONICLE_PRESENTATION_MODEL: ${{ secrets.CHRONICLE_PRESENTATION_MODEL }}
      CHRONICLE_MODEL_TIMEOUT_SECONDS: "600"

    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/chronicle-r10-live-model-contract

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/chronicle/persistence/requirements.txt

      - name: Compile temp patch helper
        run: python -m py_compile apps/chronicle/acceptance/tmp_apply_live_v5b.py

      - name: Apply focused v5 prompt and validator patch
        run: python apps/chronicle/acceptance/tmp_apply_live_v5b.py

      - name: Compile extraction modules
        run: python -m py_compile apps/chronicle/persistence/extraction.py apps/chronicle/persistence/extraction_prompt.py apps/chronicle/acceptance/live_model_contract.py

      - name: Install Chronicle dependencies
        run: python -m pip install -r apps/chronicle/persistence/requirements.txt

      - name: Run extraction contracts
        run: |
          python -m unittest apps/chronicle/persistence/test_extraction_unit.py -v
          python -m unittest apps/chronicle/persistence/test_extraction_live_limits_unit.py -v
          python -m unittest apps/chronicle/persistence/test_extraction_r8_contract_unit.py -v

      - name: Validate live secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in CHRONICLE_MODEL_ENDPOINT CHRONICLE_MODEL_API_KEY CHRONICLE_EXTRACTION_MODEL CHRONICLE_PRESENTATION_MODEL; do
            [ -n "${!name:-}" ] || { echo "missing required secret: $name" >&2; exit 1; }
          done
          echo 'live model secret presence: PASS'

      - name: Run real Luna extraction contract
        run: python apps/chronicle/acceptance/live_model_contract.py

      - name: Commit validated implementation when changed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/chronicle/persistence/extraction.py \
            apps/chronicle/persistence/extraction_prompt.py \
            apps/chronicle/persistence/test_extraction_unit.py \
            apps/chronicle/persistence/test_extraction_r8_contract_unit.py \
            apps/chronicle/acceptance/live_model_contract.py \
            .github/workflows/chronicle-live-model.yml
          if git diff --cached --quiet; then
            echo 'validated implementation already committed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tmp: validated live model contract fix'
          git push origin HEAD:tmp/chronicle-r10-live-model-contract
