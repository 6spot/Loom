name: M2 T4 Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

env:
  RUST_VERSION: "1.97.1"

jobs:
  apply:
    if: github.head_ref == 'feat/m2-t4-postgresql-work-leases' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_test
      LOOM_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"

      - name: Apply and verify T4 source changes
        run: |
          python3 tools/m2_t4_apply.py
          python3 tools/m2_t4_followup.py
          cargo fmt --all
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test -p loom-storage postgres_18_work -- --nocapture

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/loom-runtime/src/persistence.rs crates/loom-runtime/src/orchestration.rs crates/loom-storage/src/in_memory.rs crates/loom-storage/src/postgres.rs crates/loom-storage/src/postgres/work.rs crates/loom-storage/tests/postgres_work.rs tests/loom-composition/subresolution.rs
          git commit -m "M2-T4: implement PostgreSQL Work lease fencing"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
