# Temporary branch-only validation; delete before the C1-T13 delivery PR.
name: Chronicle T13 dev check

on:
  push:
    branches:
      - feat/chronicle-c1-t13-high-density-corpus
    paths:
      - ".github/workflows/chronicle-t13-dev-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control

    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/chronicle-c1-t13-high-density-corpus
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Make real immutable sources fail closed without extraction model
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/chronicle/worker/ingestion_worker.py")
          text = path.read_text()
          old = '''            if stage == CHUNK_BEARING_STAGE:\n                if self.chunk_model is not None:\n'''
          new = '''            if stage == CHUNK_BEARING_STAGE:\n                if (\n                    self.chunk_model is None\n                    and real is not real_unset\n                    and real is not None\n                ):\n                    error = (\n                        "real immutable source requires an extraction model; "\n                        "refusing deterministic fake extraction"\n                    )\n                    with psycopg.connect(self.database_url) as conn:\n                        control_plane.advance_stage_fenced(\n                            conn, job_id=job_id, stage=stage,\n                            status="failed", worker=self.worker, error=error,\n                        )\n                        control_plane.set_job_status_fenced(\n                            conn, job_id=job_id, status="failed",\n                            worker=self.worker, error=error,\n                        )\n                    self._emit("stage_failed", {"stage": stage, "error": error})\n                    return "failed"\n                if self.chunk_model is not None:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("real-source extraction guard insertion point not found")
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Probe live model credential availability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          print(f"OPENAI_API_KEY available={bool(os.environ.get('OPENAI_API_KEY'))}")
          PY

      - name: Full Chronicle worker contracts
        run: |
          set -euo pipefail
          python -m pip install -r apps/chronicle/persistence/requirements.txt
          python -m pip install -r apps/chronicle/read_api/requirements.txt
          python -m unittest discover -s apps/chronicle/worker -p 'test_*.py' -v

      - name: Source-pack operator contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s apps/chronicle/corpus -p 'test_*.py' -v

      - name: Chronicle Compose model contract
        env:
          CHRONICLE_POSTGRES_PASSWORD: ci-only-postgres-password
          CHRONICLE_ADMIN_USER: admin
          CHRONICLE_ADMIN_PASSWORD: ci-only-admin-password-0123456789abcdef
          CHRONICLE_MODEL_ENDPOINT: https://api.example.invalid/v1/responses
          CHRONICLE_MODEL_API_KEY: ci-placeholder-not-called
          CHRONICLE_EXTRACTION_MODEL: extract-ci
          CHRONICLE_PRESENTATION_MODEL: present-ci
        run: |
          set -euo pipefail
          docker compose -f compose.chronicle.yaml --profile worker config --quiet
          docker compose -f compose.chronicle.yaml --profile worker config > /tmp/chronicle-compose.txt
          grep -Fq 'CHRONICLE_MODEL_ENDPOINT: https://api.example.invalid/v1/responses' /tmp/chronicle-compose.txt
          grep -Fq 'CHRONICLE_EXTRACTION_MODEL: extract-ci' /tmp/chronicle-compose.txt
          grep -Fq 'CHRONICLE_PRESENTATION_MODEL: present-ci' /tmp/chronicle-compose.txt
          grep -Fq 'CHRONICLE_MODEL_TIMEOUT_SECONDS: "120"' /tmp/chronicle-compose.txt

      - name: Prepare pinned C1-T13 Wikisource pack
        run: |
          set -euo pipefail
          python apps/chronicle/corpus/source_pack.py prepare \
            --manifest apps/chronicle/corpus/c1-t13/source-pack.json \
            --output-dir /tmp/c1-t13-prepared \
            > /tmp/c1-t13-prepare.log
          cat /tmp/c1-t13-prepare.log
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/c1-t13-prepared')
          report = json.loads((root / 'prepared.json').read_text())
          assert report['schema'] == 'chronicle.prepared-source-pack', report
          assert len(report['sources']) == 6, report['sources']
          seen = set()
          for item in report['sources']:
              raw = (root / item['filename']).read_bytes()
              assert len(raw) == item['bytes'] and len(raw) >= 1000, item
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], item
              assert item['sha256'] not in seen, item
              assert f"oldid={item['oldid']}" in item['source_label'], item
              assert raw.endswith(b'\n'), item
              seen.add(item['sha256'])
              print(item['key'], item['bytes'], item['sha256'])
          print('C1-T13 pinned acquisition: PASS')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: c1-t13-prepared-source-pack
          path: /tmp/c1-t13-prepared
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated fail-closed worker guard
        run: |
          set -euo pipefail
          git add apps/chronicle/worker/ingestion_worker.py
          if git diff --cached --quiet; then
            echo "real-source fail-closed guard already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(chronicle): fail closed real ingestion without model"
          git push origin HEAD:feat/chronicle-c1-t13-high-density-corpus
