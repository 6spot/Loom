# Temporary branch-only validation; delete before the C1-T13 delivery PR.
name: Chronicle T13 dev check

on:
  push:
    branches:
      - feat/chronicle-c1-t13-high-density-corpus
    paths:
      - ".github/workflows/chronicle-t13-dev-check.yml"

permissions:
  contents: write

jobs:
  studio-ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/chronicle-c1-t13-high-density-corpus
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configure isolated Chronicle test environment
        run: |
          set -euo pipefail
          echo "CHRONICLE_POSTGRES_USER=chronicle" >> "$GITHUB_ENV"
          echo "CHRONICLE_POSTGRES_PASSWORD=t13-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "CHRONICLE_POSTGRES_DB=chronicle" >> "$GITHUB_ENV"
          echo "CHRONICLE_DATA_DIR=/tmp/loom-chronicle-t13-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "CHRONICLE_BIND_IP=127.0.0.1" >> "$GITHUB_ENV"
          echo "CHRONICLE_PORT=18080" >> "$GITHUB_ENV"
          echo "CHRONICLE_IMAGE_TAG=c1-t13-dev" >> "$GITHUB_ENV"
          echo "CHRONICLE_ADMIN_USER=c1-t13-admin" >> "$GITHUB_ENV"
          echo "CHRONICLE_ADMIN_PASSWORD=t13-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Make source-storage failures controlled persistence errors
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/chronicle/persistence/documents.py')
          text = path.read_text()
          old = '''    dest = resolve_storage_path(storage_dir, storage_key)\n    dest.parent.mkdir(parents=True, exist_ok=True)\n    tmp = dest.parent / f".tmp-{uuid.uuid4().hex}"\n    try:\n'''
          new = '''    dest = resolve_storage_path(storage_dir, storage_key)\n    try:\n        dest.parent.mkdir(parents=True, exist_ok=True)\n    except OSError as exc:\n        raise PersistenceError(f"failed to prepare source storage: {exc}") from exc\n    tmp = dest.parent / f".tmp-{uuid.uuid4().hex}"\n    try:\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('write_source_file mkdir anchor not found')
              text = text.replace(old, new, 1)

          old = '''    dest = resolve_storage_path(storage_dir, storage_key)\n    # Stage bytes to a temp sibling first so a DB failure leaves no visible\n    # partial file behind.\n    dest.parent.mkdir(parents=True, exist_ok=True)\n    tmp = dest.parent / f".tmp-{revision_id.hex}"\n'''
          new = '''    dest = resolve_storage_path(storage_dir, storage_key)\n    # Stage bytes to a temp sibling first so a DB failure leaves no visible\n    # partial file behind. Directory failures are normal persistence errors,\n    # never uncaught exceptions that tear down the Studio sidecar connection.\n    try:\n        dest.parent.mkdir(parents=True, exist_ok=True)\n    except OSError as exc:\n        raise PersistenceError(f"failed to prepare source storage: {exc}") from exc\n    tmp = dest.parent / f".tmp-{revision_id.hex}"\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('upload_revision mkdir anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Prepare pinned six-source pack
        run: |
          set -euo pipefail
          rm -rf /tmp/c1-t13-prepared /tmp/c1-t13-evidence "$CHRONICLE_DATA_DIR"
          mkdir -p /tmp/c1-t13-evidence "$CHRONICLE_DATA_DIR/postgres" "$CHRONICLE_DATA_DIR/sources"
          python apps/chronicle/corpus/source_pack.py prepare \
            --manifest apps/chronicle/corpus/c1-t13/source-pack.json \
            --output-dir /tmp/c1-t13-prepared \
            > /tmp/c1-t13-evidence/prepare.log

      - name: Start production-shaped Chronicle stack without worker
        run: |
          set -euo pipefail
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml up -d --build
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${CHRONICLE_PORT}/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml ps -a
            docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml logs
            exit 1
          fi
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
            logs chronicle-init | tee /tmp/c1-t13-evidence/chronicle-init.log
          grep -q "entities=66 events=45 relations=2" /tmp/c1-t13-evidence/chronicle-init.log

      - name: Capture C0 baseline density
        run: |
          set -euo pipefail
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
            exec -T chronicle-read python3 apps/chronicle/corpus/metrics.py \
            > /tmp/c1-t13-evidence/baseline.json
          cat /tmp/c1-t13-evidence/baseline.json

      - name: Ingest six sources through authenticated Studio HTTP twice
        run: |
          set -euo pipefail
          python apps/chronicle/corpus/source_pack.py ingest \
            --source-dir /tmp/c1-t13-prepared \
            --base-url "http://127.0.0.1:${CHRONICLE_PORT}" \
            --admin-user "$CHRONICLE_ADMIN_USER" \
            --admin-password "$CHRONICLE_ADMIN_PASSWORD" \
            --report /tmp/c1-t13-evidence/ingest-first.json \
            > /tmp/c1-t13-evidence/ingest-first.log
          python apps/chronicle/corpus/source_pack.py ingest \
            --source-dir /tmp/c1-t13-prepared \
            --base-url "http://127.0.0.1:${CHRONICLE_PORT}" \
            --admin-user "$CHRONICLE_ADMIN_USER" \
            --admin-password "$CHRONICLE_ADMIN_PASSWORD" \
            --report /tmp/c1-t13-evidence/ingest-second.json \
            > /tmp/c1-t13-evidence/ingest-second.log

      - name: Verify queued control-plane state and Studio routes
        run: |
          set -euo pipefail
          curl -fsS -u "$CHRONICLE_ADMIN_USER:$CHRONICLE_ADMIN_PASSWORD" \
            "http://127.0.0.1:${CHRONICLE_PORT}/studio/sources" \
            >/tmp/c1-t13-evidence/studio-sources.html
          curl -fsS -u "$CHRONICLE_ADMIN_USER:$CHRONICLE_ADMIN_PASSWORD" \
            "http://127.0.0.1:${CHRONICLE_PORT}/studio/imports" \
            >/tmp/c1-t13-evidence/studio-imports.html
          curl -fsS -u "$CHRONICLE_ADMIN_USER:$CHRONICLE_ADMIN_PASSWORD" \
            "http://127.0.0.1:${CHRONICLE_PORT}/api/v1/studio/documents" \
            >/tmp/c1-t13-evidence/documents.json
          curl -fsS -u "$CHRONICLE_ADMIN_USER:$CHRONICLE_ADMIN_PASSWORD" \
            "http://127.0.0.1:${CHRONICLE_PORT}/api/v1/studio/jobs?limit=100&offset=0" \
            >/tmp/c1-t13-evidence/jobs.json
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
            exec -T chronicle-read python3 apps/chronicle/corpus/metrics.py \
            > /tmp/c1-t13-evidence/queued-after.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          ev = Path('/tmp/c1-t13-evidence')
          baseline = json.loads((ev / 'baseline.json').read_text())
          after = json.loads((ev / 'queued-after.json').read_text())
          first = json.loads((ev / 'ingest-first.json').read_text())
          second = json.loads((ev / 'ingest-second.json').read_text())
          documents = json.loads((ev / 'documents.json').read_text())
          jobs = json.loads((ev / 'jobs.json').read_text())
          prepared = json.loads(Path('/tmp/c1-t13-prepared/prepared.json').read_text())

          assert baseline['historical_knowledge']['canonical_entities'] == 66, baseline
          assert baseline['historical_knowledge']['canonical_events'] == 45, baseline
          assert len(prepared['sources']) == len(first['sources']) == len(second['sources']) == 6
          one = {row['key']: row for row in first['sources']}
          two = {row['key']: row for row in second['sources']}
          for src in prepared['sources']:
              a, b = one[src['key']], two[src['key']]
              assert a['source_sha256'] == b['source_sha256'] == src['sha256']
              assert a['document_created'] is True and a['job_created'] is True and a['job_status'] == 'queued', a
              assert b['document_created'] is False and b['revision_duplicate'] is True and b['job_created'] is False, b
              assert (b['document_id'], b['revision_id'], b['job_id']) == (a['document_id'], a['revision_id'], a['job_id'])

          assert after['control_plane']['documents'] - baseline['control_plane']['documents'] == 6
          assert after['control_plane']['document_revisions'] - baseline['control_plane']['document_revisions'] == 6
          assert after['control_plane']['ingestion_jobs'] - baseline['control_plane']['ingestion_jobs'] == 6
          assert after['control_plane']['ingestion_jobs_by_status'].get('queued') == 6, after
          assert after['historical_knowledge'] == baseline['historical_knowledge'], (baseline, after)
          assert after['reader_presentation'] == baseline['reader_presentation'], (baseline, after)
          assert len([d for d in documents.get('documents', []) if d.get('title', '').startswith('三國志·')]) == 6
          assert len(jobs.get('jobs', [])) == 6 and all(j.get('status') == 'queued' for j in jobs['jobs'])
          assert '<!doctype html' in (ev / 'studio-sources.html').read_text(errors='replace').lower()
          assert '<!doctype html' in (ev / 'studio-imports.html').read_text(errors='replace').lower()
          print('C1-T13 Studio HTTP ingestion + idempotency: PASS')
          print(json.dumps({'baseline': baseline, 'queued_after': after}, ensure_ascii=False, indent=2))
          PY

      - name: Commit validated storage error mapping
        run: |
          set -euo pipefail
          git add apps/chronicle/persistence/documents.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(chronicle): surface source storage failures"
          git push origin HEAD:feat/chronicle-c1-t13-high-density-corpus

      - name: Upload T13 Studio-ingestion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-t13-studio-ingestion-evidence
          path: |
            /tmp/c1-t13-prepared/prepared.json
            /tmp/c1-t13-evidence
          if-no-files-found: error
          retention-days: 14

      - name: Show final container state
        if: always()
        run: docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml ps -a || true

      - name: Stop Chronicle stack
        if: always()
        run: |
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml down --remove-orphans || true
          sudo rm -rf "$CHRONICLE_DATA_DIR" || true
