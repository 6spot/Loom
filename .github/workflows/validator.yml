name: Validator

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: validator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.1"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.classify.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify affected contracts
        id: classify
        run: python3 tools/ci_routing.py classify --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  validator-ledger:
    name: Validator task ledger
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['validator-ledger']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: READY fixtures
        run: python3 tools/test_validator_ready.py

      - name: Validator task ledger
        run: python3 tools/validator_ready.py --check

      - name: Validator re-certification ledger
        run: python3 tools/validator_ready.py --root docs/tasks/validator-recert --check --format json

      - name: Validator Stage-1 re-certification ledger
        run: python3 tools/validator_ready.py --root docs/tasks/validator-recert/stage-1 --check --format json

  validator-static:
    name: Validator static checks
    needs: changes
    if: fromJSON(needs.changes.outputs.plan).jobs['validator-static']
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Validator helper syntax
        run: |
          for helper in tools/validator-authority-gate.sh tools/validator-certification-gate.sh tools/validator-pg18-gate.sh tools/test.sh tools/postgres-test.sh; do
            bash -n "$helper"
          done
          python3 -m py_compile tools/validator-certification-gate.py

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: validator-static-${{ runner.os }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            validator-static-${{ runner.os }}-${{ env.RUST_VERSION }}-

      - name: Format Validator
        run: cargo fmt --manifest-path apps/loom-validator/Cargo.toml -- --check

      - name: Check Validator
        run: cargo check -p loom-validator --all-targets --all-features

      - name: Clippy Validator
        run: cargo clippy -p loom-validator --all-targets --all-features -- -D warnings

      - name: Validator Rustdoc
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p loom-validator --no-deps

  validator-gate:
    name: Validator Gate
    if: always()
    needs: [changes, validator-ledger, validator-static]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Require every selected check to succeed
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci_routing.py gate --group validator

  multica-wakeup:
    name: Notify Multica of CI failure
    needs: [validator-gate]
    if: >
      failure() && !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'Multica-Issue:')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/multica-ci-wakeup.yml
    secrets:
      MULTICA_URL: ${{ secrets.MULTICA_URL }}
      MULTICA_PAT: ${{ secrets.MULTICA_PAT }}
      MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
