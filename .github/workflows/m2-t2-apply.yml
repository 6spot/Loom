name: M2 T2 Source Apply

on:
  pull_request:

permissions:
  contents: read

env:
  RUST_VERSION: "1.97.1"

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/m2-t2-postgresql-read-parity' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Apply T2 source migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/m2_t2_apply.py')
          text = path.read_text()
          text = text.replace(
              'Entity { entity_id: entity_id, id: entity_id, world_id }',
              'Entity { id: entity_id, world_id }',
          )
          text = text.replace(
              'parse_identity::<WorldId>(row_string(&timeline_row, "world_id")?, "WorldId")?',
              'parse_identity::<WorldId>(&row_string(&timeline_row, "world_id")?, "WorldId")?',
          )
          text = text.replace(
              'WorldStore::snapshot(&storage, timeline)',
              'loom_runtime::WorldStore::snapshot(&storage, timeline)',
          )
          text = text.replace(
              'WorldStore::snapshot(&storage, missing).await',
              'loom_runtime::WorldStore::snapshot(&storage, missing).await',
          )
          needle = 'async_test_tail(\n    "tests/loom-composition/vertical_slice.rs",'
          insertion = 'async_test_tail(\n    "crates/loom-storage/src/tests.rs",\n    ["invoke", "execute_work"],\n)\n\n'
          if insertion not in text:
              text = text.replace(needle, insertion + needle)
          path.write_text(text)
          PY
          python3 tools/m2_t2_apply.py
          cargo fmt --all

      - name: Compile generated source
        run: cargo check --workspace --all-targets --all-features

      - name: Commit generated source
        run: |
          if git diff --quiet -- \
            Cargo.lock \
            crates/loom-api \
            crates/loom-runtime \
            crates/loom-storage \
            tests/loom-composition \
            docs/architecture/runtime-contracts.md; then
            echo "Generated source is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            Cargo.lock \
            crates/loom-api \
            crates/loom-runtime \
            crates/loom-storage \
            tests/loom-composition \
            docs/architecture/runtime-contracts.md
          git commit -m "M2-T2: implement async PostgreSQL read parity"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
