name: Multica CI Wakeup

on:
  workflow_run:
    workflows:
      - CI
      - Validator
      - Chronicle
      - Chronicle Docker
    types:
      - completed

permissions:
  contents: read
  pull-requests: read

jobs:
  wake:
    # workflow_run can access repository secrets. Only accept failed CI runs
    # for pull requests whose head repository is this repository, never an
    # untrusted fork.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'failure'

    runs-on: ubuntu-latest

    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="$(
            jq -r '.workflow_run.pull_requests[0].number // empty' \
              "$GITHUB_EVENT_PATH"
          )"

          # Some workflow_run payloads do not carry pull_requests. Fall back
          # to resolving the PR associated with the workflow head SHA.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "/repos/${REPO}/commits/${HEAD_SHA}/pulls" \
                --jq '.[0].number // empty'
            )"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with this workflow run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json number,title,body,headRefName \
            > /tmp/pr.json

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Resolve Multica issue
        if: steps.pr.outputs.skip != 'true'
        id: multica_issue
        shell: bash
        run: |
          set -euo pipefail

          ISSUE_KEY="$(
            jq -r '.body // ""' /tmp/pr.json \
              | sed -nE \
                  's/^[[:space:]]*Multica-Issue:[[:space:]]*(ME-[0-9]+)[[:space:]]*$/\1/p' \
              | head -1
          )"

          if [ -z "$ISSUE_KEY" ]; then
            echo "PR does not contain a valid Multica-Issue line."
            echo "Expected: Multica-Issue: ME-123"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Wake Multica Squad Leader
        if: steps.multica_issue.outputs.skip != 'true'
        env:
          MULTICA_URL: ${{ secrets.MULTICA_URL }}
          MULTICA_PAT: ${{ secrets.MULTICA_PAT }}
          MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
          ISSUE_KEY: ${{ steps.multica_issue.outputs.key }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          MULTICA_URL="${MULTICA_URL%/}"

          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg conclusion "$WORKFLOW_CONCLUSION" \
            --arg sha "$HEAD_SHA" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            '{
              type: "comment",
              content:
                ("GitHub CI failed. Re-query authoritative linked PR/check state and continue recovery." +
                 "\nPR=" + $pr +
                 "\nworkflow=" + $workflow +
                 "\nconclusion=" + $conclusion +
                 "\nhead_sha=" + $sha +
                 "\nworkflow_run_id=" + $run_id)
            }' \
          > /tmp/multica-comment.json

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${MULTICA_PAT}" \
            -H "X-Workspace-ID: ${MULTICA_WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/multica-comment.json \
            "${MULTICA_URL}/api/issues/${ISSUE_KEY}/comments"

          echo
          echo "Multica Leader wake sent for ${ISSUE_KEY}."
