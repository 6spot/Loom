name: Multica CI Wakeup

on:
  # Called inside the failed CI run, so successful runs do not create a
  # separate, skipped Multica workflow_run entry in Actions.
  workflow_call:
    secrets:
      MULTICA_URL:
        required: true
      MULTICA_PAT:
        required: true
      MULTICA_WORKSPACE_ID:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  wake:
    # Callers require failure() and the marker before invoking this workflow.
    # Keep the same-repository boundary here too, before accessing secrets.
    if: >
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'Multica-Issue:')

    runs-on: ubuntu-latest

    steps:
      - name: Resolve Multica issue from the current pull request
        id: multica_issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" \
            --repo "$REPO" \
            --json body,state,headRefOid \
            > "$RUNNER_TEMP/multica-pr.json"

          if ! jq -e --arg sha "$HEAD_SHA" \
            '.state == "OPEN" and .headRefOid == $sha' \
            "$RUNNER_TEMP/multica-pr.json" > /dev/null; then
            echo "PR is closed or its head has changed; no wake needed."
            exit 0
          fi

          ISSUE_KEY="$(
            jq -r '.body // ""' "$RUNNER_TEMP/multica-pr.json" \
              | sed -nE \
                  's/^[[:space:]]*Multica-Issue:[[:space:]]*(ME-[0-9]+)[[:space:]]*$/\1/p' \
              | sed -n '1p'
          )"

          if [ -z "$ISSUE_KEY" ]; then
            echo "PR does not contain a valid Multica-Issue line."
            echo "Expected: Multica-Issue: ME-123"
            exit 0
          fi

          echo "key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

      - name: Wake Multica Squad Leader
        if: steps.multica_issue.outputs.key != ''
        env:
          MULTICA_URL: ${{ secrets.MULTICA_URL }}
          MULTICA_PAT: ${{ secrets.MULTICA_PAT }}
          MULTICA_WORKSPACE_ID: ${{ secrets.MULTICA_WORKSPACE_ID }}
          ISSUE_KEY: ${{ steps.multica_issue.outputs.key }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_CONCLUSION: failure
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          MULTICA_URL="${MULTICA_URL%/}"

          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg workflow "$WORKFLOW_NAME" \
            --arg conclusion "$WORKFLOW_CONCLUSION" \
            --arg sha "$HEAD_SHA" \
            --arg run_id "$WORKFLOW_RUN_ID" \
            '{
              type: "comment",
              content:
                ("GitHub CI failed. Re-query authoritative linked PR/check state and continue recovery." +
                 "\nPR=" + $pr +
                 "\nworkflow=" + $workflow +
                 "\nconclusion=" + $conclusion +
                 "\nhead_sha=" + $sha +
                 "\nworkflow_run_id=" + $run_id)
            }' \
          > "$RUNNER_TEMP/multica-comment.json"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${MULTICA_PAT}" \
            -H "X-Workspace-ID: ${MULTICA_WORKSPACE_ID}" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/multica-comment.json" \
            "${MULTICA_URL}/api/issues/${ISSUE_KEY}/comments"

          echo
          echo "Multica Leader wake sent for ${ISSUE_KEY}."
