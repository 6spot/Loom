name: Temporary Chronicle R19 review batching

on:
  push:
    branches:
      - tmp/chronicle-r19-review-batching
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tmp-r19-review-batching
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply R19 integration patch
        run: python tools/tmp_r19_apply.py

      - name: Install Chronicle dependencies
        run: |
          python -m pip install -r apps/chronicle/persistence/requirements.txt
          python -m pip install -r apps/chronicle/read_api/requirements.txt

      - name: Validate R18 review batching
        run: python apps/chronicle/persistence/test_review_subjects_r16_unit.py

      - name: Chronicle persistence contracts
        run: python -m unittest discover -s apps/chronicle/persistence -p 'test_*.py' -v

      - name: Chronicle read-model contracts
        run: python -m unittest discover -s apps/chronicle/read_api -p 'test_*.py' -v

      - name: Chronicle Studio contracts and production build
        run: |
          set -euo pipefail
          cd apps/chronicle/webapp
          npm ci
          npm test
          npm run build
          npm run smoke:dist

      - name: Commit tested generated implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/chronicle/persistence/resolve_publish.py \
            apps/chronicle/read_api/studio_reviews.py \
            apps/chronicle/webapp/src/lib/studio-api.ts \
            apps/chronicle/webapp/src/pages/studio/StudioReviewPage.tsx \
            apps/chronicle/web/dist
          if git diff --cached --quiet; then
            echo 'tested implementation already committed'
            exit 0
          fi
          git commit -m 'chore(tmp): apply R19 review batching'
          git push origin HEAD:tmp/chronicle-r19-review-batching
