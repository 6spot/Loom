# Temporary branch-only validation; delete before the C1-T16 delivery PR is Ready.
name: Chronicle T16 dev check

on:
  push:
    branches:
      - feat/chronicle-c1-t16-world-ui-time-context
    paths:
      - ".github/workflows/chronicle-t16-dev-check.yml"

permissions:
  contents: write

jobs:
  high-density-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/chronicle-c1-t16-world-ui-time-context

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json

      - name: Build, test and synchronize deterministic web dist
        run: |
          set -euo pipefail
          cd apps/chronicle/webapp
          npm ci
          npm test
          npm run build
          npm run smoke:dist
          cd ../../..
          git add apps/chronicle/web/dist
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(chronicle): sync C1-T16 web dist"
            git push origin HEAD:feat/chronicle-c1-t16-world-ui-time-context
          fi

      - name: Install Chronicle Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r apps/chronicle/persistence/requirements.txt

      - name: Configure isolated Chronicle acceptance environment
        run: |
          set -euo pipefail
          echo "CHRONICLE_POSTGRES_USER=chronicle" >> "$GITHUB_ENV"
          echo "CHRONICLE_POSTGRES_PASSWORD=t16-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "CHRONICLE_POSTGRES_DB=chronicle" >> "$GITHUB_ENV"
          echo "CHRONICLE_DATA_DIR=/tmp/loom-chronicle-t16-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "CHRONICLE_BIND_IP=127.0.0.1" >> "$GITHUB_ENV"
          echo "CHRONICLE_PORT=18080" >> "$GITHUB_ENV"
          echo "CHRONICLE_IMAGE_TAG=c1-t16-fixture" >> "$GITHUB_ENV"
          echo "CHRONICLE_ADMIN_USER=c1-t16-admin" >> "$GITHUB_ENV"
          echo "CHRONICLE_ADMIN_PASSWORD=t16-admin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Prepare and verify pinned six-source pack
        run: |
          set -euo pipefail
          rm -rf /tmp/c1-t16-prepared /tmp/c1-t16-evidence "$CHRONICLE_DATA_DIR"
          mkdir -p /tmp/c1-t16-evidence "$CHRONICLE_DATA_DIR/postgres" "$CHRONICLE_DATA_DIR/sources"
          python apps/chronicle/corpus/source_pack.py prepare \
            --manifest apps/chronicle/corpus/c1-t13/source-pack.json \
            --output-dir /tmp/c1-t16-prepared \
            > /tmp/c1-t16-evidence/prepare.log
          python apps/chronicle/corpus/verify_fixture_pack.py \
            --source-pack apps/chronicle/corpus/c1-t13/source-pack.json \
            --fixture-pack apps/chronicle/corpus/c1-t13/model-fixture-pack.json \
            --prepared-dir /tmp/c1-t16-prepared \
            > /tmp/c1-t16-evidence/fixture-verification.json

      - name: Start production-shaped Chronicle stack
        run: |
          set -euo pipefail
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml up -d --build
          ready=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:${CHRONICLE_PORT}/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml ps -a
            docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml logs
            exit 1
          fi
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
            logs chronicle-init | tee /tmp/c1-t16-evidence/chronicle-init.log
          grep -q "entities=66 events=45 relations=2" /tmp/c1-t16-evidence/chronicle-init.log

      - name: Queue and run six source-bound fixture jobs
        run: |
          set -euo pipefail
          python apps/chronicle/corpus/source_pack.py ingest \
            --source-dir /tmp/c1-t16-prepared \
            --base-url "http://127.0.0.1:${CHRONICLE_PORT}" \
            --admin-user "$CHRONICLE_ADMIN_USER" \
            --admin-password "$CHRONICLE_ADMIN_PASSWORD" \
            --report /tmp/c1-t16-evidence/ingest.json \
            > /tmp/c1-t16-evidence/ingest.log
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
            --profile worker run --rm --no-deps \
            -e CHRONICLE_MODEL_FIXTURE_PACK=/opt/loom/apps/chronicle/corpus/c1-t13/model-fixture-pack.json \
            chronicle-worker \
            python3 apps/chronicle/corpus/c1-t13/fixture_worker.py \
              --worker-id c1-t16-fixture-pass1 \
              --lease-seconds 300 \
              --poll-interval 0.1 \
              --max-jobs 6 \
              --model-budget-chars 32000 \
            | tee /tmp/c1-t16-evidence/worker-pass1.log

      - name: Converge review, resolution, publication and presentation
        run: |
          set -euo pipefail
          converged=0
          for cycle in 1 2 3 4; do
            report="/tmp/c1-t16-evidence/review-cycle-${cycle}.json"
            python apps/chronicle/corpus/c1-t13/fixture_review.py \
              --base-url "http://127.0.0.1:${CHRONICLE_PORT}" \
              --admin-user "$CHRONICLE_ADMIN_USER" \
              --admin-password "$CHRONICLE_ADMIN_PASSWORD" \
              --report "$report" \
              > "/tmp/c1-t16-evidence/review-cycle-${cycle}.log"

            read -r resolved resumed < <(python3 - "$report" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          print(data['resolved_review_count'], data['resumed_job_count'])
          PY
            )
            echo "review cycle ${cycle}: resolved=${resolved} resumed=${resumed}"
            if [ "$resumed" -eq 0 ]; then
              converged=1
              break
            fi

            docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
              --profile worker run --rm --no-deps \
              -e CHRONICLE_MODEL_FIXTURE_PACK=/opt/loom/apps/chronicle/corpus/c1-t13/model-fixture-pack.json \
              chronicle-worker \
              python3 apps/chronicle/corpus/c1-t13/fixture_worker.py \
                --worker-id "c1-t16-fixture-resume-${cycle}" \
                --lease-seconds 300 \
                --poll-interval 0.1 \
                --max-jobs "$resumed" \
                --model-budget-chars 32000 \
              > "/tmp/c1-t16-evidence/worker-resume-${cycle}.log"
          done
          [ "$converged" -eq 1 ]

      - name: Verify accepted corpus and Historical World browser flow
        run: |
          set -euo pipefail
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml \
            exec -T chronicle-read python3 apps/chronicle/corpus/metrics.py \
            > /tmp/c1-t16-evidence/final.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          final = json.loads(Path('/tmp/c1-t16-evidence/final.json').read_text())
          assert final['historical_knowledge']['canonical_entities'] == 87, final
          assert final['historical_knowledge']['canonical_events'] == 70, final
          assert final['reader_presentation']['published_presentations'] == 25, final
          assert final['historical_knowledge']['latest_catalog_sha256'], final
          print('C1-T16 high-density corpus metrics: PASS')
          PY
          python apps/chronicle/web/world_browser_smoke.py \
            --base-url "http://127.0.0.1:${CHRONICLE_PORT}" \
            | tee /tmp/c1-t16-evidence/world-browser.log

      - name: Upload T16 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-t16-high-density-world-evidence
          path: /tmp/c1-t16-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml ps -a || true
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml logs || true

      - name: Stop Chronicle stack
        if: always()
        run: |
          docker compose --env-file .env.chronicle.example -f compose.chronicle.yaml down --remove-orphans || true
          sudo rm -rf "$CHRONICLE_DATA_DIR" || true
