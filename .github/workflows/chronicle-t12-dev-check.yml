# Temporary branch-only validation; delete before the T12 delivery PR.
name: Chronicle T12 dev check

on:
  push:
    branches:
      - feat/chronicle-c1-t12-reader-presentation
    paths:
      - ".github/workflows/chronicle-t12-dev-check.yml"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: loom
          POSTGRES_PASSWORD: loom
          POSTGRES_DB: loom_control
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loom -d loom_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      LOOM_TEST_POSTGRES_URL: postgresql://loom:loom@localhost:5432/loom_control
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/chronicle-c1-t12-reader-presentation
          fetch-depth: 0
      - name: Apply small T12 source patches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          test_path = Path("apps/chronicle/persistence/test_control_plane_postgres.py")
          text = test_path.read_text()
          needle = '                    "0004_chronicle_c1_segmentation.sql",\n                ],'
          replacement = '                    "0004_chronicle_c1_segmentation.sql",\n                    "0005_chronicle_c1_reader_presentations.sql",\n                ],'
          if needle in text:
              test_path.write_text(text.replace(needle, replacement, 1))
          elif '"0005_chronicle_c1_reader_presentations.sql"' not in text:
              raise SystemExit("migration expectation patch target not found")

          css_path = Path("apps/chronicle/webapp/src/styles/chronicle.css")
          css = css_path.read_text()
          if ".reader-presentation {" not in css:
              css += dedent("""

              /* C1-T12 derived Reader Presentation: readable first, evidence always available. */
              .reader-presentation {
                margin: 0 0 1.4rem;
                padding: 1.4rem;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--paper-strong);
                box-shadow: var(--shadow);
              }
              .reader-presentation-heading {
                display: flex;
                align-items: flex-start;
                justify-content: space-between;
                gap: 1rem;
              }
              .reader-presentation-heading h2 { margin-bottom: .35rem; }
              .reader-version {
                white-space: nowrap;
                padding: .3rem .58rem;
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--muted);
                font-size: .72rem;
                font-weight: 750;
              }
              .reader-provenance-note {
                max-width: 780px;
                margin-bottom: 1rem;
                color: var(--muted);
                font-size: .82rem;
                line-height: 1.65;
              }
              .reader-blocks { display: grid; gap: .8rem; }
              .reader-block {
                padding: 1rem 1.05rem;
                border-left: 3px solid var(--gold);
                border-radius: 0 12px 12px 0;
                background: var(--paper);
              }
              .reader-block-uncertainty {
                border-left-color: var(--uncertain);
                background: var(--uncertain-soft);
              }
              .reader-block-label {
                margin-bottom: .35rem;
                color: var(--gold);
                font-size: .72rem;
                font-weight: 800;
                letter-spacing: .08em;
              }
              .reader-block-uncertainty .reader-block-label { color: var(--uncertain); }
              .reader-block > p { margin-bottom: .75rem; font-size: 1.04rem; line-height: 1.8; }
              .reader-evidence-group > summary,
              .reader-support > summary,
              .reader-generation-meta > summary {
                cursor: pointer;
                color: var(--muted);
                font-size: .76rem;
                font-weight: 700;
              }
              .reader-support-list { display: grid; gap: .55rem; margin-top: .65rem; }
              .reader-support {
                padding: .7rem .8rem;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--paper-strong);
              }
              .reader-support-body { margin-top: .65rem; }
              .reader-support-body code { color: var(--muted); font-size: .7rem; }
              .reader-support-body blockquote {
                margin: .55rem 0;
                padding-left: .8rem;
                border-left: 2px solid var(--line);
                font-family: ui-serif, Georgia, "Songti SC", serif;
                line-height: 1.75;
              }
              .reader-support-body pre {
                overflow-x: auto;
                margin: .5rem 0 0;
                font-size: .7rem;
                white-space: pre-wrap;
              }
              .reader-generation-meta { margin-top: 1rem; }
              .reader-generation-meta dl { display: grid; gap: .4rem; margin-bottom: 0; }
              .reader-generation-meta dl > div { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .7rem; }
              .reader-generation-meta dt { color: var(--muted); font-size: .72rem; }
              .reader-generation-meta dd { margin: 0; overflow-wrap: anywhere; font-size: .76rem; }

              @media (max-width: 540px) {
                .reader-presentation-heading { display: block; }
                .reader-version { display: inline-flex; margin-bottom: .8rem; }
                .reader-generation-meta dl > div { grid-template-columns: 1fr; gap: .15rem; }
              }
              """)
              css_path.write_text(css)
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python contracts
        run: |
          set -euo pipefail
          python -m pip install -r apps/chronicle/persistence/requirements.txt
          python -m pip install -r apps/chronicle/read_api/requirements.txt
          python -m unittest discover -s apps/chronicle/persistence -p 'test_*.py' -v
          python -m unittest discover -s apps/chronicle/read_api -p 'test_*.py' -v
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chronicle/webapp/package-lock.json
      - name: Webapp contracts
        working-directory: apps/chronicle/webapp
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
          npm run smoke:dist
      - name: Commit validated source patches and real dist
        run: |
          set -euo pipefail
          git add -A \
            apps/chronicle/persistence/test_control_plane_postgres.py \
            apps/chronicle/webapp/src/styles/chronicle.css \
            apps/chronicle/web/dist
          if git diff --cached --quiet; then
            echo "T12 patches/dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(chronicle): validate T12 reader surface and dist"
          git push origin HEAD:feat/chronicle-c1-t12-reader-presentation
