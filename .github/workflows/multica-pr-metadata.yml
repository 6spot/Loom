name: Multica PR Metadata

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  normalize:
    name: Normalize PR lifecycle metadata
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.body || '', 'Multica-Issue:') ||
       contains(github.event.pull_request.body || '', 'GitHub-Issue:'))
    runs-on: ubuntu-latest

    steps:
      - name: Ensure close intents
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          body = event["pull_request"].get("body") or ""

          additions = []
          body_changed = False

          multica_marker_re = re.compile(
              r"(?mi)^\s*Multica-Issue:\s*([A-Za-z][A-Za-z0-9]*-\d+)\s*$"
          )
          multica_markers = list(dict.fromkeys(multica_marker_re.findall(body)))
          if len(multica_markers) > 1:
              raise SystemExit(
                  "Expected at most one Multica issue identifier, found: "
                  + ", ".join(multica_markers)
              )
          if multica_markers:
              issue_key = multica_markers[0]
              close_re = re.compile(
                  rf"(?mi)^\s*(?:Closes|Fixes|Resolves)\s+{re.escape(issue_key)}\s*$"
              )
              no_close_re = re.compile(
                  rf"(?mi)^\s*Multica-No-Close:\s*{re.escape(issue_key)}\s*$"
              )
              if no_close_re.search(body):
                  # Explicit opt-out for NOT_PASSED deliveries: the PR stays
                  # linked via Multica-Issue but must not record close intent.
                  # Strip any previously added close line so the steady state
                  # is self-healing across later edits.
                  stripped = close_re.sub("", body).rstrip() + "\n"
                  if stripped != body:
                      body = stripped
                      body_changed = True
                      print(f"Removed close intent for opted-out {issue_key}")
                  else:
                      print(f"PR opts out of close intent for {issue_key}; nothing to do")
              elif not close_re.search(body):
                  additions.append(f"Closes {issue_key}")

          github_marker_re = re.compile(
              r"(?mi)^\s*GitHub-Issue:\s*#?(\d+)\s*$"
          )
          github_markers = list(dict.fromkeys(github_marker_re.findall(body)))
          if len(github_markers) > 1:
              raise SystemExit(
                  "Expected at most one GitHub issue number, found: "
                  + ", ".join(f"#{number}" for number in github_markers)
              )
          if github_markers:
              issue_number = github_markers[0]
              close_re = re.compile(
                  rf"(?mi)^\s*(?:Closes|Fixes|Resolves)\s+#{re.escape(issue_number)}\s*$"
              )
              if not close_re.search(body):
                  additions.append(f"Closes #{issue_number}")

          if not additions and not body_changed:
              print("PR lifecycle metadata already normalized")
              raise SystemExit(0)

          if body_changed and not additions:
              normalized_body = body
          else:
              normalized_body = body.rstrip()
              if normalized_body:
                  normalized_body += "\n\n"
              normalized_body += "\n".join(additions) + "\n"

          payload = Path("/tmp/pr-body.json")
          payload.write_text(json.dumps({"body": normalized_body}))

          subprocess.run(
              [
                  "gh",
                  "api",
                  "--method",
                  "PATCH",
                  f"repos/{os.environ['REPOSITORY']}/pulls/{os.environ['PR_NUMBER']}",
                  "--input",
                  str(payload),
              ],
              check=True,
          )
          if additions:
              print("Added close intent(s): " + ", ".join(additions))
          else:
              print("Stripped stale close intent; no additions")
          PY
